[mod-setting-description]
fw-rp-convergence-universal=Let the final Convergence Synthesis Plant also run Flux Arc Foundry recipes. Its two fluid input ports are preserved. Disable to retain synthesis-only machine behavior.
fw-rp-process-tempo=Change crafting time of FluxWorks Spectrum Industries and industrial-extension alternatives only. Rapid crafts in 75% of the time; Deliberate takes 130%. Ingredient quantities and native recipes do not change.
fw-rp-project-research=Adjust the costs of FluxWorks' four optional industrial projects only, without editing any other mod's science, planet discoveries, or research.

