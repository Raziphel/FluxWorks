fw-lens-array=Stack polished optics on a substrate to build a sturdier instrument-grade lens assembly.
fw-sensor-diode=Fuse optics and wafer components into a directional sensing element for advanced controls.
fw-pressure-housing=Turn cermet, structure, and filtering hardware into a sealed industrial shell.
