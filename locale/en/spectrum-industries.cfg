[recipe-description]
fw-spectrum-circuit-annealing=Concentrate advanced circuitry with Matter Flux. Uses sensor hardware to reduce the cost of high-end processors.
fw-spectrum-superconductor-alignment=Align copper conductors around stabilized Flux crystals for bulk superconductive output.
fw-spectrum-lattice-weaving=Manufacture resonance lattices more efficiently from stabilized crystals and supporting metalwork.
fw-spectrum-polymer-catalysis=Blend coal, resin and Chemical Flux into industrial-grade plastic. An alternate supply route for large chemical factories.
fw-spectrum-battery-electroforming=Precisely plate battery electrodes using Chemical Flux. Consumes extra salts and metal for a larger batch.
fw-spectrum-sensor-photolithography=Build precision sensor packages in a synthesis plant with a dedicated Chemical Flux etching cycle.
fw-spectrum-arc-steel-reduction=Superheat iron and refined carbon in the Arc Foundry. Converts Fuel Flux into higher steel throughput.
fw-spectrum-structural-flux-casting=Press copper, steel, resin and cermet into low-density aerospace structures under a sustained Fuel Flux heat cycle.
fw-spectrum-propellant-intensification=Combine liquid fuel, solid fuel and energetic compounds to produce rocket fuel in larger batches.
fw-spectrum-resin-bioreclamation=Convert spoilage and nutrients into useful resin using Biological Flux. A renewable sink for your factory's biological waste.
fw-spectrum-carbon-fiber-cultivation=Cultivate structural carbon fiber from Gleba crops and resin with an energized biological reaction.
fw-spectrum-bioflux-fermentation=Convert spoilage and nutrients back into bioflux by consuming nutrient beds and Biological Flux.
fw-spectrum-chromatic-cermet=Combine Fuel Flux and Chemical Flux to forge dense composite cermet in the Arc Foundry.
fw-spectrum-chromatic-resonance=Fuse Matter Flux and Biological Flux to fabricate resonance substrates from established industrial components.
