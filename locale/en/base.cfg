[technology-description]
fw-liquid-mining=Unlocks liquid-assisted extraction for difficult ores, including chlorine feed for titanium mining.
fw-comminution=Unlocks crusher operation and the first rough-crushing chain for iron, copper, and sand recovery.
fw-ore-crushing=Extends the crusher program into heavier ore bodies, opening refined lead and titanium recovery from crushed stock.
fw-mineral-beneficiation=Turns crude crushing into a richer refining branch with carbon recovery, brine salts, and better ore separation.
fw-material-foundations=Establishes the first industrial material chain with glassmaking and synthetic rubber work.
fw-structural-fabrication=Pushes basic materials into practical structure parts like formed tubing, mesh, and beam stock.
fw-contact-casting=Introduces dedicated contact-forming work so early circuit parts stop hiding inside broader material unlocks.
fw-metals-fabrication=Expands early metalworking into solder alloys, bearings, and ceramic insulators for proper machine assemblies.
fw-beam-engineering=Focuses the structural branch on stronger beam work for midgame frames and reinforced fabrication.
fw-conductive-assembly=Builds a real cable-prep layer with tinned conductors and bundled harnessing for later control systems.
fw-electromechanical-systems=Introduces advanced electrical subcomponents like substrates, coils, and capacitors.
fw-material-refinement=Develops refined composite and filter materials for high-purity industrial throughput.
fw-instrumentation=Unlocks precision optical and sensing assemblies for advanced electronics and control.
fw-systems-integration=Integrates sensors and transformer cores into robust networked machine and platform systems.
fw-advanced-fabrication=Unlocks high-end composite construction, lightweight frames, and upgraded propellant compounds.
fw-circuit-foundry=Turns the electronics branch into a real manufacturing lane with contacts, solder work, and rugged wafer prep.
fw-wafer-etching=Separates wafer processing and chip-carrier assembly into a clear bridge between basic parts and serious electronics.
fw-signal-architecture=Builds dependable signal paths with bundled conductors, control chips, and tighter routing discipline.
fw-computational-arrays=Scales the electronics line into proper computational hardware with packaged memory instead of loose parts.
fw-industrial-expansion=Unlocks advanced FluxWorks processing routes, synthetic component loops, and late-midgame industrial upgrades.
fw-flux-extraction=Post-rocket extraction program that authorizes Flux Quarry deployment for industrial-scale Flux Rift harvesting.
fw-flux-mining-productivity=Infinite research that improves mining drill productivity for Flux Rift extraction and all other drill-based resource harvesting.
rocket-chunk-processing=Enables used rocket remnants to drift through orbit. Recovered chunks can be reprocessed into rocket components, excluding fuel.
remnant-beacon=Remnant beacons attract used rocket remnants when placed on a platform. Powered beacons make those platforms a priority for remnant spawns.
fw-flux-catalysis=Starts the Flux program with reusable catalysts and the first ore-spectrum transmutation routes.
fw-flux-stabilization=Turns unstable recovered Flux into stabilized crystals and structured lattices suitable for larger system builds.
fw-flux-yellow-catalysis=Builds the first structured Yellow Flux branch around chlorine pressure, acid routing, and industrial chemical rearrangement.
fw-harvester-systems=Turns stabilized Flux hardware into a practical ore-grading machine layer so upcycling, downcycling, and beneficiation become a real factory step.
fw-flux-structuring=Moves stabilized Flux out of raw crystal handling and into structured lattices suitable for precision assemblies and machine platforms.
fw-flux-red-energetics=Applies Flux to fuel density and combustion hardware so energetic routes become a real specialization instead of a side effect.
fw-flux-green-reclamation=Introduces Green Flux as a recovery medium for spoilage, nutrient salvage, and late biological loops.
fw-flux-metallurgy=Pushes Red Flux into dedicated foundry hardware and annealed material work instead of treating high-heat processing as a side branch.
fw-flux-resonance=Turns the early Flux branches into condensed matrices and resonance cells that can support heavier multi-color systems.
fw-resonance-assemblies=Combines resonance substrates, condensed matrices, and Green Flux stabilization into the first true multi-spectrum assembly platform.
fw-flux-asteroid-harvesting=Adapts asteroid salvage routes to the Flux economy by recovering and refining Flux asteroid chunks into valuable materials.
fw-flux-field-theory=Pushes transmutation into deeper color bands, locking advanced Flux theory behind true quantum-era space hardware instead of generic utility milestones.
fw-aquilo-cryochemistry=Turns Yellow Flux chemistry toward Aquilo with conditioned electrolyte, improved lithium recovery, and fluoroketone process control.
fw-gleba-biochemistry=Turns Gleba biomass into a proper late-game chemistry reward by culturing spore resin that feeds high-end Flux hardware.
fw-flux-chemical-synthesis=Expands Yellow Flux into true factory chemistry with resin, vulcanization, and battery-electrolyte shortcuts.
fw-vulcanus-pyrochemistry=Pushes Flux chemistry into Vulcanus-grade heat and slag conditioning so the foundry branch earns a real planetary endgame reward.
fw-flux-reactive-slurries=Turns structured chemistry and energetic Flux into demolition gels and the most unstable industrial slurries.
fw-fulgora-electrochemistry=Bridges Fulgora field hardware and electrochemistry into a charged conductor stock meant for serious electromagnetic infrastructure.
fw-flux-green-cultivation=Lets Green Flux support bioflux growth, aquaculture, and biological processing instead of only cleanup work.
fw-flux-green-propagation=Pushes Green Flux into aggressive seed duplication and late regenerative supply chains.
fw-flux-thermal-networks=Bridges Red Flux into high-power thermal routing for rocket-fuel grade industrial energy systems.
fw-superconductive-systems=Bridges Aquilo cryochemistry and electromagnetic control into superconductors and supercapacitors that feel like proper late planetary hardware.
fw-flux-phase-engineering=Combines resonance, cryogenic control, and field theory into manifold-scale multi-phase Flux architecture.
fw-deep-phase-storage=Turns phase-engineering theory into practical deep-storage infrastructure, unlocking the first FluxWorks utility machine that compresses real factory inventory instead of only processing it.
fw-spectral-fluid-retention=Extends deep phase utility work into temperature-aware fluid retention, unlocking reservoir hardware for the coldest and most demanding late-process fluids.
fw-rift-logistics=Turns the utility branch into true cross-surface logistics, unlocking a paired transfer gate for promethium-era infrastructure instead of leaving late transport to ordinary local storage.
fw-flux-overdrive=Turns the Red branch into a dangerous endgame power network capable of staging the heaviest fuel systems.
fw-fusion-lattices=Carries Flux hardware into fusion-era containment, stabilizing conditioned power-cell work with promethium-safe lattice control.
fw-flux-synthesis=Unifies the branch work into condenser access and late synthesis machinery, where Flux becomes a real manufacturing platform.
fw-flux-convergence=Final late-game Flux coordination that ties the color branches, planetary reward materials, and strategic synthesis routes into one endgame platform.
fw-rift-harmonics=Final promethium-era harmonic control that enables synthetic rift crystal growth without collapsing the surrounding Flux network.
fw-harvester-reprocessing-productivity=Improves FluxWorks harvesting yields by tightening catalyst reuse, filter retention, and bulk separation across the quarry support chain.
fw-polymer-reclamation-productivity=Reduces waste and boosts recovered output across the core chlorine, latex, resin, sulfur, acid, and rubber process loops.
fw-reactive-chemistry-productivity=Pushes more usable demolition and energetic chemistry out of each volatile batch without flattening the underlying chain.
fw-green-reclamation-productivity=Focuses Green Flux recovery on spoilage cleanup and nutrient salvage so the reclamation loop can scale on its own cheaper tier.
fw-green-cultivation-productivity=Improves the biological output side of Green Flux by tightening bioflux growth, biolubricant culture, and aquaculture feed yields.
fw-green-propagation-productivity=Pushes the seed-multiplication side of Green Flux into its own stronger productivity tier for regenerative supply chains.
fw-cryogenic-loop-productivity=Stabilizes late cryochemical and coolant handling so Aquilo-grade processes return more usable material per run.
fw-resonance-material-productivity=Improves the expensive resonance material ladder so condensed matrices, lattices, and substrates stop living inside one giant late-game productivity pile.
fw-phase-assembly-productivity=Pushes the final multi-phase assembly hardware onto its own top-end productivity tier where resonance cells and manifolds matter most.
fw-asteroid-refinement-productivity=Extracts more useful Flux material from every salvaged chunk by tightening the deep-space refinement pass.
fw-gleba-biochemistry-productivity=Gives the Gleba reward chain its own productivity lane so spore-resin output scales without dragging every planetary recipe into the same bucket.
fw-fulgora-electrochemistry-productivity=Separates the Fulgora reward chain into a focused electrochemical productivity bonus for scrap sorting and static mesh production.
fw-vulcanus-pyrochemistry-productivity=Separates the Vulcanus reward chain into its own slag-conditioning productivity bonus instead of bundling it with every other planetary material.
fw-superconductive-productivity=Improves the most advanced cryo-electric component work so superconductor and supercapacitor preparation wastes less high-end input.
fw-promethium-containment-productivity=Sharpens the late promethium handling chain so primer, matrix, stabilizer, and fusion-cell conditioning all return more usable endgame hardware.
fw-rift-synthesis-productivity=Pushes the final condenser and harmonic synthesis routes to return more strategic output from the most expensive FluxWorks endgame recipes.
fw-ceramic-engineering=Extends early FluxWorks structure parts into ceramic shells and durable machine casings.
fw-conductive-networks=Builds denser coil and conduit hardware so midgame electrical recipes can feel like real assemblies.
fw-optical-instrumentation=Pushes optics beyond a single lens into proper sensing arrays and instrument-grade signal parts.
fw-sealed-systems=Introduces sealed housings and flow regulators for machines that should actually look process-ready.
fw-polymer-chemistry=Turns the first liquid-mining chemistry into a real polymer branch with resin, sulfur, acid, and vulcanized material loops.
fw-power-regulation=Turns the transformer branch into a broader power-control layer for utility and late factory infrastructure.
fw-energetic-compounds=Builds a distinct munitions-and-electrolyte branch so demolition gels, battery chemistry, and napalm arrive as a coherent military-industrial step.
fw-metallurgic-assemblies=Adds dedicated metallurgic subassemblies instead of treating foundries like just bigger furnaces.
fw-biosystems-engineering=Gives biological production its own prepared substrates and filtration parts rather than borrowing generic filters forever.
fw-cryogenic-control=Builds a real cryogenic hardware layer with specialized coils and thermal damping, tied directly into Aquilo-grade machinery.
fw-electromagnetic-architecture=Packages sensing, routing, and dense field control into a proper electromagnetic late-game branch anchored to Fulgora machinery.
fw-orbital-hardening=Prepares reusable orbital hardware with dedicated avionics and heatshield assemblies before remnant salvage and heavier platform work.
fw-promethium-stabilization=Replaces awkward generic endgame ingredients with promethium-specific Flux hardware built for the final science tier.

