fw-green-flux-from-nutrients=Turn stable nutrient stock into a stronger green-spectrum biological Flux reserve.
fw-green-flux-from-bioflux=Condition concentrated biological feed into a richer living Flux stream.
fw-green-flux-from-raw-fish=Use dense aquaculture biomass to recover a practical regenerative Flux charge.
fw-green-flux-from-yumako-seed=Condition Yumako seed tissue into a reusable green-spectrum growth catalyst.
fw-green-flux-from-jellynut-seed=Condition Jellynut seed stock into a reusable green-spectrum propagation catalyst.
fw-green-flux-from-tree-seed=Condition tree seed stock into a reusable green-spectrum regeneration catalyst.
fw-green-flux-spoilage-reclamation=Flood decomposed biomass with Green Flux to transmute spoilage back into stable nutrient stock.
fw-green-flux-bioflux-cultivation=Drive a nutrient-spoilage slurry through Green Flux to transmute decaying biomass into concentrated bioflux.
fw-green-flux-biolubricant-culture=Culture dense biological feedstock under Green Flux to transmute living slurry into stable industrial biolubricant.
fw-green-flux-aquaculture-feed=Use Green Flux nutrient broth to transmute basic fish feed into accelerated aquaculture growth.
fw-green-flux-yumako-seed-propagation=Use Green Flux bioreactivity to transmute one Yumako seed line into a stable propagated stock.
fw-green-flux-jellynut-seed-propagation=Use Green Flux to transmute Jellynut seed tissue into repeatable propagated stock.
fw-green-flux-tree-seed-propagation=Use Green Flux to transmute viable tree tissue into industrial-scale seed stock.
fw-red-flux-nuclear-fuel-staging=Stage rocket propellant, fissile feed, and thermal Flux through a hardened power core to assemble late-game nuclear fuel.
fw-fired-ceramic=Fire stone and silicate feed into a sturdy ceramic stock for the next wave of machine parts.
fw-flux-fired-ceramic-annealing=Use raw Flux as an aggressive firing aid to squeeze extra ceramic stock out of a modest early batch.
fw-ceramic-casing=Wrap fired ceramic in structural steel and insulation to produce a reliable machine casing.
fw-coil-block=Pack coils, insulators, and charge hardware into a dense electromagnetic block.
fw-signal-conduit=Combine shielded cable, formed tube, and insulation into a clean signal path.
fw-lens-array=Stack polished optics on a substrate to build a sturdier instrument-grade lens assembly.
fw-sensor-diode=Fuse optics and wafer components into a directional sensing element for advanced controls.
fw-promethium-sensor-diode-doping=Seed a sensor diode build with trace promethium so the rare shard pays off in a stronger early precision batch instead of sitting idle until the endgame condenser line.
fw-pressure-housing=Turn cermet, structure, and filtering hardware into a sealed industrial shell.
fw-flow-regulator=Build a meter-and-balance insert for chemical, refinery, and thermal machinery.
fw-power-regulator=Package transformer, storage, and insulation parts into a more deliberate power-routing component.
fw-field-winding=Upgrade a transformer core into a high-field winding assembly for late electrical machines.
fw-foundry-lining=Cast a heat-safe foundry liner from cermet, ceramic, and titanium reinforcement.
fw-smelter-array=Assemble a controlled high-temperature module for metallurgic systems and heavier machine recipes.
fw-nutrient-bed=Prepare a resin-bound nutrient substrate for consistent bioprocessing throughput.
fw-spore-filter=Add sealing and optics to a nutrient bed to produce a cleaner biological process module.
fw-cryo-coil=Build a cold-stable winding assembly for cryogenic equipment and low-temperature science.
fw-thermal-buffer=Combine cryogenic control hardware with cermet structure to smooth extreme thermal cycling.
fw-em-core=Integrate sensing, regulation, and dense electrical routing into a precision electromagnetic core.
fw-logic-matrix=Assemble a compact late-game control core from EM hardware, chips, and sensing modules.
fw-spectral-coolant-blend=Blend cryogenic feedstock with conditioned Flux streams to make colder, denser fluoroketone for the late machine and science chain.
fw-promethium-primer=Condense trace promethium, catalyst hardware, and every Flux spectrum into a controllable industrial feedstock for the last progression tier.
fw-promethium-matrix=Stabilize promethium asteroid matter inside a multi-spectrum resonance matrix so the condenser can push it into true endgame hardware.
fw-rift-stabilizer=Bind manifolds, promethium, and all four conditioned Flux spectra into a final-stage stabilizer for the most volatile systems.
fw-phase-anchor=Build the spatial anchor hardware that lets FluxWorks utility systems hold a stable compressed state instead of flying apart under phase load.
fw-entanglement-core=Assemble the control core that keeps compressed storage coherent while coordinating state changes through late electrical hardware.
fw-reservoir-lining=Package thermal buffers, regulators, and casing parts into a containment shell for the later fluid-memory branch.
fw-compression-baffle=Build the dedicated baffle hardware that separates one stable item stream from the deeper phase-held reserve inside a vault.
fw-thermal-phase-gasket=Seal thermal and phase-routing hardware together for the later reservoir and exchange-machine branches.
fw-rift-coupler=Build the first real rift-bridge transport component from phase anchors, control hardware, and promethium-conditioned field parts.
fw-phase-vault=Construct a powered deep-storage vault that holds one item type in a compressed reserve and refills a visible front buffer while energy is available.
fw-spectral-reservoir=Construct a powered fluid-memory reservoir that stores one stabilized fluid in a deeper spectral reserve while preserving its working temperature.
fw-rift-exchange-gate=Construct a cross-surface logistics teleporter that drinks 150 MW into a 3 GJ charge cycle before swapping inventories with a matched remote gate.
fw-origin-forge=Build the late-game Shattered forge that turns matured Flux production into real megastructure construction.
fw-storm-spine-segment=Forge a storm-rated structural segment from stabilizers, fusion hardware, and converged Flux so red-spectrum fracture belts finally pay back in megastructure stock.
fw-origin-crucible-lining=Build the promethium-safe lining that keeps source-grade reactions from eating the crucible meant to contain them.
fw-harmonic-lattice-core=Assemble the control heart that lets storm infrastructure, lattice geometry, and entanglement logic survive inside origin-grade projects.
fw-living-reactor-weave=Fuse biological regeneration into a late fusion substrate so the green lane has a real voice inside Shattered megaprojects.
fw-origin-catalyst-manifold=Force catalyst control, rift coupling, and manifold routing into one endgame assembly that exists only to feed the ugliest source-grade projects.
fw-storm-spine=Assemble a true storm-bearing trunk from origin infrastructure, stabilizer hardware, and converged flux until the Shattered network starts looking like a deliberate machine.
fw-origin-crucible=Assemble the crucible body that can actually hold the branch's final source-grade reactions instead of just feeding them through smaller storm arrays.
fw-universal-collapse-core=Forge an origin-grade collapse seed from a billion units of every Flux color at once, plus the heaviest Shattered megastructure hardware in the branch.
fw-genesis-ark=Commit a full thousand Collapse Cores into one impossible megaproject body, making the total spend a literal trillion of each flux spectrum before the final launch layer even begins.
fw-origin-singularity=Assemble the final Shattered Planet monument. Place it, charge it during a storm, and activate it to win.
incomplete-rocket-part=Partially assembled rocket section used in the remnant-recovery rocket chain.
rocket-chunk-processing=Reprocess recovered rocket debris into useful rocket parts and materials.
remnant-beacon=Build a powered beacon that makes a space platform a preferred target for used rocket remnant spawns.
fw-reactive-slurry-focusing=Concentrate blasting gel and Yellow Flux into a denser demolition mix for better cliff charge output.
fw-gelled-napalm-mixing=Blend blasting gel into a thicker incendiary fuel batch for higher napalm output.
fw-green-flux-compost-bloom=Use spoilage, nutrients, and Green Flux to recover a compact bioflux bloom from waste.
fw-green-flux-biolubricant-bloom=Push Green Flux cultivation toward bulk biolubricant output instead of general biological growth.
fw-green-flux-aquaculture-bloom=Turn Green Flux cultivation into a breeding surge for fish production.
fw-spectral-coolant-recycling=Recover cold fluoroketone through a closed-loop cryogenic recycling pass.
fw-aquilo-cryogel-annealing=Run cryogel through a colder, more controlled finishing pass to improve output and hardware retention.
fw-flux-resonance-cell-calibration=Calibrate resonance cells around reusable catalyst control for steadier late-game assembly.
fw-flux-phase-manifold-calibration=Tune phase manifold assembly for improved catalyst retention and cleaner multi-spectrum routing.
fw-flux-asteroid-core-sorting=Sort Flux asteroid cores into cleaner crystal and matrix output with better catalyst recovery.
fw-ion-storm-cryogel-annealing=Use the Shattered Planet's storm and mixed spectra to finish cryogel packs more efficiently, turning a difficult landing zone into a real cold-chain export surface.
fw-ion-storm-resonance-cell-overdrive=Drive resonance-cell assembly directly through storm-saturated purple islands for a denser late-game control export.
fw-ion-storm-phase-manifold-weaving=Weave multi-spectrum manifolds inside a mature storm bridgehead, paying back the miserable footprint with stronger converged hardware output.
fw-ion-storm-static-mesh-overcharge=Overcharge Fulgora-grade field mesh under the ion storm so shattered resonance islands can export denser electrical hardware instead of only raw vent fluid.
fw-ion-storm-slag-cermet-tempering=Temper cermet in a harsher storm-fed heat regime, making red-biased shattered bridgeheads a serious source of top-tier foundry stock.
fw-ion-storm-superconductor-bath=Use the ion storm as part of a converged cryo-electrical bath, giving mature shattered outposts a direct path into better superconductive hardware.
fw-ion-storm-fusion-power-cell-conditioning=Condition fusion cells directly on the Shattered Planet with storm-fed flux, reactor hardware, and planetary capstones to make the source surface feel like true endgame industry.
fw-ion-storm-rift-seed-crystallization=Push high-end manifolds through the ion storm itself to regrow crystallised Flux faster than a normal converged refinery line can manage.
fw-ion-storm-rift-stabilizer-convergence=Force every mature Shattered bridgehead lane into one brutal stabilizer assembly pass, turning the source planet into the real summit of Flux progression.
fw-origin-cascade=Push a fully converged storm array to its promethium-era limit, the same industrial threshold that eventually justifies forging and awakening the Origin Singularity itself.

