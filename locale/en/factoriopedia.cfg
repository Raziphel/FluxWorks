[tips-and-tricks-item-description]
fluxworks-overview=FluxWorks starts as a resource expansion and slowly turns into its own production language.\n\nYou begin by extracting [entity=fw-crystalised-flux] with the [entity=fw-flux-quarry]. From there the chain splits into handling, metallurgy, synthesis, and eventually orbital salvage. If a recipe feels strange, the usual answer is to step one machine earlier and ask which Flux layer it belongs to.
flux-rift-extraction=[entity=fw-flux-quarry] only works on [entity=fw-crystalised-flux] rifts, so think of it as a dedicated field machine rather than a general miner.\n\nRifts are rich but specialized. Once you have stable quarry output, convert that raw Flux into catalysts and machine parts instead of trying to stockpile it forever as a raw ore.
mixed-deposit-planning=Most FluxWorks worldgen is built around mixed deposits instead of perfectly pure patches. [entity=fw-metallic-deposit], [entity=fw-mineral-deposit], and [entity=fw-carbonic-deposit] are meant to give you broad mining districts that feed several chains at once.\n\nThat means sorting and beneficiation matter more than in vanilla. Plan belts, trains, and buffers around families of output rather than assuming every patch deserves its own isolated smelting line.
flux-processing-ladder=The usual machine order is [entity=fw-flux-harvester] for beneficiation and tier shifts, then [entity=fw-arc-foundry] for hotter structural materials, then [entity=fw-synthesis-plant] for resonance and promethium work.\n\nIf you are unsure where a recipe belongs, follow the item family: rough ore and mixed deposits go to the Harvester, heat-stressed materials go to the Arc Foundry, and phase-controlled parts go to the Synthesis Plant.
flux-synthesis-and-cloning=[entity=fw-synthesis-plant] is where raw Flux finally becomes disciplined. This is the machine for stabilized crystals, lattices, matrices, and the first serious promethium intermediates.\n\n[entity=fw-flux-condenser] sits even later. It clones seed items using standard recipes and [fluid=fw-purple-flux], so it works best as a multiplier for expensive products, not as a replacement for your normal production lines.
promethium-ramp=Promethium should feel like a ramp, not a wall. Start with [item=fw-promethium-shard], turn that into [item=fw-promethium-primer], then graduate into matrices and stabilizers once the rest of your Flux factory is mature enough to support them.\n\nIf promethium recipes feel expensive, that is usually a signal that your resonance, lattice, and catalyst production is still too small. Grow the supporting factory first and the promethium lane becomes much smoother.
flux-orbital-salvage=FluxWorks also has a space-side salvage loop. [entity=remnant-beacon] attracts recoverable rocket remnants, and processed [item=rocket-chunk] gives platforms a way to reclaim advanced materials instead of treating launches as pure waste.\n\nThis complements platform production nicely: asteroid processing handles the steady basics, while remnant salvage helps cover the expensive aerospace edge pieces.
