[technology-description]
fw-foundry-commission-calidus=The first standard is measured in iron and patience. Bring the chemical discipline of FluxWorks into Calidus manufacturing.
fw-foundry-commission-solaris=Forging is no longer a struggle against heat: it is an agreement with it. Temper the red discipline against genuine volcanic material.
fw-foundry-commission-nyxaris=Not every machine must be built. Some can be grown, cultivated and returned to service. Build a biological production standard.
fw-foundry-commission-vibrant=Some circuits cannot be etched until their alignment is understood. Map the phase discipline onto high-energy materials.
fw-foundry-commission-vespera=Control temperature, and you control the boundary between a functional machine and a broken one. Record the frozen industrial standard.
fw-foundry-commission-beetlejuice=Beyond familiar materials, the factory must calculate its own tolerances. Recover quantum manufacturing knowledge from the far systems.
fw-foundry-commission-umbra=At the threshold of the unknown, all four Works must become one. Preserve the last phase alignment.
fw-foundry-atlas=Seven industrial records, or as many real systems as your installed galaxy can supply. Their combined calibrations let the Convergence Forge produce sophisticated materials through hard-won interstellar logistics. This is an industrial accomplishment, never a substitute for Razi's ending.

