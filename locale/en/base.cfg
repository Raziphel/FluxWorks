fw-silicon-beneficiation=Process silicon ore into refined silicon while recovering silicate sand.
fw-carbon-washing=Wash coal with water to recover refined carbon feedstock and trace reactive byproducts.
fw-salt-brine-clarification=Clarify mineral brine through a Flux Harvester to pull out a denser chlorine stream without burning through fresh filters every cycle.
fw-silica-beneficiation=Grade silicon-bearing ore through catalyst beds and wash stages to improve silicon yield while kicking out reusable sand.
fw-carbonic-washing=Run coal through a wetter regenerative wash to recover cleaner carbon feedstock and a little useful sulfur.
fw-bauxite-slurry-clarification=Clarify low-grade bauxite slurry through Flux-guided filtration to lift aluminum feed quality and recover silicate waste.
fw-tin-ore-beneficiation=Wash and sort tin ore through a denser yellow-spectrum separation pass to recover a cleaner cassiterite stream with trace lead byproduct.
fw-lead-ore-beneficiation=Leach and separate low-grade lead ore into a denser crushed stream fit for higher-yield smelting.
fw-titanium-slurry-grading=Grade titanium-bearing slurry through a harsher recovery pass so difficult ore bodies become worth real industrial treatment.
fw-carbon-grade-screening=Screen washed carbon stock through a deeper recovery pass to produce better furnace-grade carbon with less waste.
fw-tinned-cable=Tin-plate cable finishing process for higher conductivity wiring bundles.
fw-silicon-wafer=Fabricate precision silicon wafers for chip carriers and memory stacks.
silicon=Carbothermal silicon refining that upgrades silicon ore using refined carbon.
fw-purple-flux=Refine raw Rift fragments into the first disciplined form of Shattered Flux, creating the purple base stream used across transmutation and activation chains.
fw-flux-catalyst=Condition shattered Flux fragments into a reusable catalyst that teaches the factory how to push unstable source material through repeatable industrial loops.
fw-stabilized-flux-crystal=Stabilize early Shattered Flux stock with a full-spectrum charge so fractured source crystals can survive serious machine work instead of laboratory handling.
fw-flux-lattice=Assemble stabilized Flux into a structured lattice for advanced FluxWorks systems.
fw-flux-harvester=Build a Flux Harvester to take over ore upgrading, downcycling, and the more advanced material grading recipes.
fw-arc-foundry=Build an Arc Foundry for red-spectrum annealing, dense recasts, and other hotter Flux industrial work.
fw-synthesis-plant=Build a Synthesis Plant to handle stabilized Flux assemblies, resonance hardware, and promethium processing.
fw-flux-asteroid-refining=Crush Flux asteroid chunks to recover crystallised Flux, stabilized crystals, and catalytic residues.
fw-yellow-flux-conditioning=Establish the yellow spectrum from reactive chemistry stock, then spend it across catalytic, polymer, acid, and explosive process loops.
fw-red-flux-conditioning=Establish the red spectrum from dense fuel stock, then spend it across thermal, power-dense, and high-energy industrial process loops.
fw-green-flux-conditioning=Establish the green spectrum from biomass and spoilage stock, then spend it across reclamation, cultivation, and propagation loops.
fw-condensed-flux-matrix=Condense all four conditioned Flux spectra into a pressure-loaded matrix block that anchors the late condenser chain.
fw-flux-asteroid-deep-refining=Perform high-energy refinement on Flux asteroid chunks to recover condensed matrices.
fw-flux-resonance-cell=Tune stabilized crystals into resonance cells using spectrum-conditioned Flux and reusable catalyst beds.
fw-flux-phase-manifold=Build a manifold that keeps high-pressure multi-spectrum Flux channels synchronized for advanced synthesis and condenser chains.
fw-rift-seed-crystallization=Push conditioned Flux through a phase manifold to grow fresh crystallised Flux from high-energy fluid blends.
fw-flux-metallic-synthesis=Use resonance-driven Flux conversion to synthesize strategic late-game ores at industrial scale.
fw-flux-condenser=Construct a Flux Condenser for complex clone recipes using advanced Flux assemblies instead of base raw materials.
fw-shattered-convergence-array=Construct a Shattered-only convergence machine that turns a surviving storm bridgehead into a true origin-project site.
fw-arc-insulator-vitrification=Vitrify ceramic, glass, and metal feed in the Arc Foundry to make tougher high-load insulators for late electrical hardware.
fw-chlorine-pressurization=Pressurize salt brine into a stronger chlorine split for downstream chemical processing.
fw-latex-polymerization=Polymerize plastic feed with water into an industrial latex suitable for resin and elastomer chemistry.
fw-sulfur-bonding=Bind refined carbon and chlorine into dense recoverable sulfur for munitions and acid production.
fw-acid-synthesis=Drive sulfur, chlorine, and water into concentrated sulfuric acid for battery and industrial chemistry.
fw-resin-polymerization=Polymerize latex with refined carbon into a dense industrial resin binder.
fw-rubber-vulcanization=Vulcanize resin, latex, and sulfur into higher-yield rubber sheet stock for cables and composites.
fw-blasting-gel=Stabilize explosives, resin, and water into a demolition-grade blasting gel without consuming Flux.
fw-reactive-slurry=Drive blasting gel and explosives into demolition-grade reactive slurry for cliff breaching charges.
fw-battery-electrolyte=Use lead, copper, and sulfuric acid to assemble finished battery cells through a dedicated electrolyte route.
fw-napalm=Compound blasting gel, light oil, and sulfur into an adhesive incendiary fuel reserved for flamethrower turrets.
fw-electrolyte-conditioning=Filter holmium solution through resin media to condition a denser electrolyte for late electrical chemistry.
fw-lithium-adsorption=Use FluxWorks filtration and sensing hardware to pull more lithium out of each ammonia-brine pass.
fw-fluoroketone-synthesis=Run fluorine and ammonia through regulated thermal hardware to produce a larger fluoroketone batch.
fw-aquilo-cryogel=Condense Aquilo cryochemistry into stabilized cryogel packs that make extreme cold systems more manageable.
fw-gleba-spore-resin=Culture Gleba biomass into a living industrial resin with stronger late biological and promethium utility.
fw-shielded-fuel-casing=Assemble a lead-lined, ceramic-stabilized casing that can hold harsher enriched fuel stock without turning every reactor part into scrap.
fw-fuel-pellet-bundle=Pack uranium stock into conditioned pellet bundles so the reactor branch gets a real fabrication step before finished fuel cells.
fw-moderator-lattice=Build the shielding and moderation lattice that stabilizes enriched fuel work instead of pretending every reactor assembly is just another plate recipe.
fw-control-rod-assembly=Build the regulated control hardware that lets the Atomic Enricher move from raw isotope work into true reactor-grade assemblies.
fw-reactor-coolant-cartridge=Charge a sealed cooling cartridge for enrichment and reprocessing work that would otherwise cook late nuclear hardware.
fw-radioactive-scrap-sorting=Pull usable actinide stock back out of spent radioactive residue so the Atomic Enricher supports a real recycling loop instead of one-and-done fuel craft.
