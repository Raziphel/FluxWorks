[fw-factoriopedia]
incomplete-rocket-part=An unfinished orbital frame segment recovered from FluxWorks-era launch architecture. It replaces direct rocket part crafting in balanced runs and must be finished with fuel in the silo.
incomplete-rocket-part-recipe=Builds the structural and control portion of a rocket part before fuel integration. This separates reusable hardware from consumable propellant.
fw-rocket-avionics-item=Recovered and requalified guidance electronics for rocket launch profiles and orbital targeting correction.
fw-rocket-avionics-recipe=Assembles a hardened avionics package from advanced processors, sensor blocks, and ribbon interconnects.
fw-rocket-heatshield-item=Composite thermal shield module intended for repeated atmospheric transit and refurbishment.
fw-rocket-heatshield-recipe=Builds a rocket heat shield from cermet, glass, and low-density structure framing.
rocket-chunk-item=Recovered orbital debris from a spent launch vehicle. Crush and refine these chunks to reclaim advanced components.
rocket-chunk-asteroid=Small debris fragments shed from used rockets in orbit. They can be collected and mined by platform systems.
used-rocket-asteroid=An intact spent-stage hull drifting through orbital lanes. Destroying it yields recoverable rocket chunks for industrial reprocessing.
rocket-chunk-processing-recipe=Crushes recovered rocket chunks into reusable high-tier components. This is FluxWorks' orbital salvage loop for reducing late-game launch waste.
rocket-chunk-processing-technology=Unlocks orbital remnant events and rocket chunk processing, enabling a closed-loop launch economy in space logistics chains.
remnant-beacon-item=A heavy orbital signal array tuned to remnant trajectories. Place it on station-keeping platforms to pull salvage opportunities toward your infrastructure.
remnant-beacon-entity=Powered remnant beacon that biases used-rocket spawns toward its platform. Best deployed on stable platforms with reliable power headroom.
remnant-beacon-recipe=Constructs a remnant beacon from advanced aerospace materials and control electronics.
remnant-beacon-technology=Teaches predictive remnant tracking and beacon guidance, allowing targeted recovery operations in orbit.
fw-crystalised-flux-item=A dense crystal node of condensed flux energy, harvested from rifts that act as the earliest accessible fragments of the Shattered Planet's Flux-rich crust.
fw-crystalised-flux-resource=A geologically unstable Flux Rift that concentrates shattered source material into mineable crystalline deposits long before you can reach the planet it came from.
fw-metallic-deposit-resource=Mixed metallic deposit that yields iron and copper with lead and tin traces. Its field tint now reads as a greyer ferrous seam instead of a warm copper patch, while the output mix stays focused on early broad-spectrum smelting.
fw-mineral-deposit-resource=Layered mineral deposit containing bauxite, silicon-rich material, trace titanium, and some stone gangue. It now leans harder into the bauxite-plus-silica identity instead of feeling overly rocky.
fw-carbonic-deposit-resource=Dark mixed seam producing coal and a more reliable salt residue stream for chemical refining, filtration, and other carbon-heavy industry.
fw-promethium-impact-resource=Rare meteoric impact fields where promethium-bearing fragments fused into exposed shard beds. Each tile contains only trace promethium, so these fields are for long, patient extraction rather than easy endgame jackpots.
fw-silica-vein-resource=Silicon-rich rock seam intended for wet biological terrain and sediment-heavy worlds. A natural fit for Gleba when you need direct silica supply instead of only mixed deposits.
fw-shattered-yellow-flux-vent-resource=Yellow-spectrum rupture vent found on the Shattered Planet. These are the most reliable vents and tend to cluster in dry chemistry-leaning island chains that support catalyst-heavy outposts.
fw-shattered-red-flux-vent-resource=Red-spectrum rupture vent found on the Shattered Planet. These vents are rarer and harsher, usually clustering in volcanic fracture belts suspended over open space that reward serious fuel and power staging.
fw-shattered-green-flux-vent-resource=Green-spectrum rupture vent found on the Shattered Planet. It turns calmer floating shelves into biological recovery posts by supporting spore resin and biomass export.
fw-shattered-purple-flux-vent-resource=Purple-spectrum rupture vent found on the Shattered Planet. It condenses structured Flux from the surrounding ion storm and concentrates around the coldest resonance crests.
fw-flux-quarry-item=Heavy-duty rift mining platform built to pin unstable Flux deposits in place long enough to harvest shattered source fragments safely.
fw-flux-quarry-recipe=Builds a Flux Quarry from reinforced structure, power hardware, and control systems rated for Rift extraction.
fw-flux-quarry-entity=Specialized quarry for Flux Rift fields. Place it directly over a rift to turn unstable Shattered-source crystal growth into a dependable industrial feed.
fw-purple-flux-fluid=Primary structuring flux refined from early Rift crystal harvests. It is the first disciplined form of Shattered Flux and feeds the upcycle and downcycle chains.
fw-purple-flux-recipe=Refines raw Rift fragments into the first disciplined form of Shattered Flux, establishing the purple base stream that the rest of the factory grows out of.
fw-yellow-flux-fluid=Chemical spectrum Flux used for catalyst loops, polymer work, acid routing, and other recipes where unstable chemistry needs to be shoved into line.
fw-red-flux-fluid=Thermal spectrum Flux used for fuel densification, hot industrial material work, and the high-pressure power side of the Flux chain.
fw-green-flux-fluid=Regenerative spectrum Flux used for biomass recovery, nutrient rebuilding, seed propagation, and the living side of the factory.
fw-flux-resonance-cell-item=Spectrum-tuned containment cell that stores and channels stabilized Flux in multi-phase processing systems.
fw-flux-resonance-technology=Unlocks reusable catalyst loops and resonance processing, turning Flux into a high-tier production backbone.
fw-flux-phase-manifold-item=High-stability manifold assembly that coordinates multi-phase Flux flow for advanced synthesis routes.
fw-phase-anchor-item=Spatial anchor hardware that keeps late Flux utility machines stable while they compress or hold inventory beyond normal physical limits.
fw-entanglement-core-item=Late-stage control core for deep storage and other coherence-sensitive Flux utility systems.
fw-reservoir-lining-item=Containment lining built for long-term contact with unstable late-game fluids, pressure swings, and aggressive Flux-tinted chemistry.
fw-compression-baffle-item=Dedicated item-phase routing hardware that lets a vault compress one material stream without turning into a mixed junk buffer.
fw-thermal-phase-gasket-item=Sealing hardware that keeps phase utility systems stable while they handle extreme thermal gradients and repeated packing cycles.
fw-phase-vault-item=Powered deep storage unit built for one item stream. It keeps a factory-facing front buffer ready, then compresses overflow into a far deeper powered reserve.
fw-phase-vault-entity=Late-game deep storage unit that stores one item type, exposes the total to circuits, and preserves the stored reserve when mined as a packed unit.
fw-phase-vault-recipe=Constructs a Deep Storage Unit from warehouse-scale logistics hardware, phase anchors, entanglement control, and superconductive late-game support parts.
fw-deep-phase-storage-technology=Turns phase engineering into true logistics infrastructure, unlocking the first FluxWorks machine that stores a factory-scale item reserve instead of merely processing materials.
fw-spectral-reservoir-item=Powered fluid storage unit built for one fluid stream. It holds a practical front reservoir, preserves temperature, and stores the rest in a deeper stabilized reserve.
fw-spectral-reservoir-entity=Late-game fluid storage unit with circuit output, retained temperature, and a deep powered reserve behind its visible front reservoir.
fw-spectral-reservoir-recipe=Constructs a Fluid Storage Unit from high-capacity tank hardware, containment liners, cryogenic support parts, and late Flux control infrastructure.
fw-spectral-fluid-retention-technology=Pushes deep phase utility into fluid containment, unlocking a reservoir that preserves both large volume and retained temperature for demanding late factories.
fw-rift-coupler-item=Promethium-era transport coupler that bridges the storage branch into real cross-surface logistics hardware.
fw-rift-exchange-gate-item=Cross-surface logistics teleporter inspired by Telogistics. Set a destination and optional link ID, charge a full cycle, and exchange the gate inventory with a matched remote gate.
fw-rift-exchange-gate-entity=Large late-game teleporter that acts like a container until activated. It can be built on any surface and swaps inventories only with same-quality gates on another surface.
fw-rift-exchange-gate-recipe=Constructs a Rift Exchange Gate from rift couplers, phase anchors, entanglement control, and fusion-grade endgame infrastructure.
fw-rift-exchange-fluid-gate-item=Cross-surface fluid teleporter inspired by Telogistics. Set a destination and optional link ID, charge a full cycle, and exchange the gate fluid with a matched remote gate.
fw-rift-exchange-fluid-gate-entity=Large late-game fluid teleporter that acts like a tank until activated. It can be built on any surface and swaps stored fluids only with same-quality gates on another surface.
fw-rift-exchange-fluid-gate-recipe=Constructs a Rift Exchange Fluid Gate from a Rift Exchange Gate, a Fluid Storage Unit, and the same endgame rift control stack tuned for fluid exchange.
fw-rift-logistics-technology=Carries the late utility branch into real intersurface logistics by unlocking a powered rift-transfer gate for promethium-era factories and platforms.
fw-promethium-shard-item=Trace promethium contamination bound up in rocky shard matter. Individually weak, but worth refining when collected in bulk.
fw-promethium-primer-item=First real industrial promethium product. This conditioned feedstock bridges low-grade shard recovery and the heavier promethium hardware chain.
fw-promethium-primer-recipe=Blends multiple low-grade promethium shards with stabilized Flux hardware to make a manageable promethium feedstock for advanced fabrication.
fw-ion-storm-promethium-primer-recipe=Uses the ion storm itself as part of the annealing field, improving primer yield and making late promethium work genuinely worth doing on the Shattered Planet.
fw-ion-storm-catalyst-forging-recipe=Turns the Shattered Planet's yellow vents into a direct chemistry payoff by forging extra Flux catalysts from sulfur, resin, and raw storm-conditioned flux.
fw-ion-storm-spore-resin-culture-recipe=Uses green vent output under the ion storm to grow Gleba spore resin more aggressively, giving fractured outposts a real biological export role.
fw-ion-storm-fuel-pellet-bundling-recipe=Stages dense fuel hardware under the Shattered Planet's red vent output, producing extra fuel pellet bundles from a harsher but more efficient thermal route.
fw-ion-storm-resonance-weaving-recipe=Uses purple vent output and the ion storm itself to weave resonance cells more efficiently, making the Shattered Planet a true late-game resonance surface.
fw-ion-storm-cryogel-annealing-recipe=Runs Aquilo cryogel through a storm-tuned finishing pass so shattered bridgeheads can export better cold-control material without leaving the source surface.
fw-ion-storm-resonance-cell-overdrive-recipe=Turns purple storm islands into true control-hardware foundries by overdriving resonance-cell assembly under the ion storm.
fw-ion-storm-phase-manifold-weaving-recipe=Weaves phase manifolds directly inside the ion storm, rewarding a mature shattered control outpost with stronger multi-spectrum hardware throughput.
fw-ion-storm-static-mesh-overcharge-recipe=Overcharges Fulgora-grade static mesh inside the ion storm, letting resonance-heavy shattered islands produce stronger electrical stock locally.
fw-ion-storm-slag-cermet-tempering-recipe=Uses the storm's harsher thermal regime to temper Vulcanus slag cermet more efficiently, rewarding red fracture outposts with better structural export.
fw-ion-storm-superconductor-bath-recipe=Turns mature shattered outposts into real superconductive bridgeheads by bathing late cryo-electrical hardware directly inside the ion storm.
fw-shattered-convergence-array-item=Storm-locked Shattered Planet machine for the first true origin-project recipes. It only runs during full ion storms, so it marks the point where your bridgehead becomes permanent.
fw-shattered-convergence-array-entity=Consumes all four Flux colors plus late-game planetary materials to make origin-grade project parts that cannot be built anywhere else.
fw-shattered-convergence-array-recipe=Builds the storm-only capstone machine that starts the final Shattered Planet production branch.
fw-origin-cascade-recipe=Turns a fully converged shattered supply web into a serious promethium-science pulse. It is one of the clearest signs that your bridgehead network is finally big enough to justify forging and awakening the Origin Singularity.
fw-origin-forge-item=The Origin Forge is the dedicated construction machine for the late Shattered Planet branch. It turns your mature Flux network into megastructure parts.
fw-origin-forge-entity=Build origin-grade infrastructure here using late utility parts, promethium materials, and all four established Flux lanes.
fw-origin-forge-recipe=Builds the late-game forge used for Shattered Planet megastructure production.
fw-storm-spine-segment-item=A structural storm conduit built to hold together under the nastiest red-spectrum fracture conditions on the source planet.
fw-storm-spine-segment-recipe=Turns stabilizers, fusion hardware, and converged Flux into the first real piece of Shattered megastructure stock.
fw-origin-crucible-lining-item=Promethium-safe crucible shell that can survive the thermal and phase abuse of source-grade reactions.
fw-origin-crucible-lining-recipe=Packages the late containment branch into a lining worthy of the branch's final storm projects.
fw-harmonic-lattice-core-item=The control heart that binds resonance geometry, entanglement logic, and converged lattice structure into one origin-grade block.
fw-harmonic-lattice-core-recipe=Assembles the dense harmonic core that keeps bigger Shattered projects from devolving into expensive ionized rubble.
fw-living-reactor-weave-item=An ugly but powerful fusion-biological weave proving the green lane still matters even at the very top of the branch.
fw-living-reactor-weave-recipe=Forces biological regeneration, fusion hardware, and converged Flux into one living power substrate for storm megaprojects.
fw-origin-catalyst-manifold-item=The final catalyst-routing manifold used when a normal phase manifold is no longer remotely enough machine for the job.
fw-origin-catalyst-manifold-recipe=Builds the converged manifold that lets catalyst control and source-grade routing scale into true endgame projects.
fw-storm-spine-item=A completed storm-bearing trunk section intended to anchor entire shattered bridgehead webs into one machine-scale structure.
fw-storm-spine-recipe=Turns origin infrastructure into the first truly giant Shattered assembly, rewarding factories that can keep every late lane alive at once.
fw-origin-crucible-item=A crucible body for source-grade reactions so violent that the old storm array starts looking small and polite.
fw-origin-crucible-recipe=Assembles the crucible body that finally gives the Shattered branch a proper megaproject sink instead of only science conversion.
fw-universal-collapse-core-item=A deliberate overreaction in item form: one core forged from a full billion units of every Flux color at once and the ugliest Shattered hardware stack you can sustain.
fw-universal-collapse-core-recipe=Builds the first truly absurd transcendence-tier item by dumping a billion of each Flux spectrum into one origin-forging pass.
fw-genesis-ark-item=The first object in FluxWorks that can honestly say it cost a trillion of every flux color to make and still wanted more.
fw-genesis-ark-recipe=Consumes one thousand Collapse Cores to force the Shattered Planet into a literal trillion-each cumulative spend before the final launch layer.
fw-origin-singularity-item=The final Shattered Planet monument. Place it on the source world, charge it, and awaken it to finish the run.
fw-origin-singularity-recipe=Builds the final placeable singularity monument from the Genesis Ark, Collapse Cores, and the last origin-grade infrastructure.
fw-origin-singularity-entity=A giant singularity monument that only activates on the Shattered Planet. Charge it through its full power cycle to trigger the true ending.
fw-ion-storm-fusion-power-cell-conditioning-recipe=Builds storm-conditioned fusion cells from the full late Flux and planetary-material stack, making the Shattered Planet a genuine power-hardware apex.
fw-ion-storm-rift-seed-crystallization-recipe=Uses the ion storm itself as part of the regrowth field, turning a mature bridgehead network into the fastest crystallised Flux renewal path in the mod.
fw-ion-storm-rift-stabilizer-convergence-recipe=Forces all four matured shattered export lanes through one final convergence pass, making the best Rift Stabilizer recipe belong on the source planet itself.
fw-stabilized-flux-crystal-item=Cleaned and phase-locked Flux crystal stock suitable for real industrial use instead of raw rift handling.
fw-flux-catalyst-recipe=Conditions shattered Flux fragments into a reusable catalyst, turning unstable source material into a process medium the rest of the factory can build around.
fw-stabilized-flux-crystal-recipe=Stabilizes raw crystallised Flux into a safer intermediate for synthesis, lattice work, and promethium prep.
fw-flux-lattice-item=Structured crystal framework that gives later Flux components a stable geometry to build around.
fw-flux-lattice-recipe=Builds a repeatable lattice from stabilized crystals and advanced control materials, turning loose Flux into machine-grade structure.
fw-condensed-flux-matrix-item=Compact resonance matrix used as the dense heart of late Flux machines and cloning hardware.
fw-condensed-flux-matrix-recipe=Compresses stabilized Flux assemblies into a matrix core for condensers, resonance hardware, and advanced control systems.
fw-ion-storm-condensed-flux-matrix-recipe=Over-condenses stabilized Flux inside the Shattered Planet's ion storm, producing extra matrix output and giving the shattered surface a real condenser payoff.
fw-flux-catalyst-item=Starter catalyst for the first real Flux chemistry loop. It is the point where mined rift material becomes a reusable process medium.
fw-flux-synthesis-technology=Develops phase-manifold Flux synthesis for synthetic rift growth and strategic ore conversion.
fw-flux-condenser-item=FluxWorks cloning machine for expensive products. Feed it one seed item and Purple Flux to make an extra copy.
fw-flux-condenser-entity=Dedicated cloning machine that uses normal recipes, inventories, and pipe connections.
fw-rocket-engine-item=FluxWorks-standard high-thrust engine module used in advanced platform and propulsion assemblies.
fw-transformer-core-item=High-density transformer core used wherever late-game factories need clean power routing, stable fields, or hardened platform infrastructure.
fw-ceramic-engineering-technology=Opens the first proper ceramic lane, turning raw mineral processing into heat-safe casings, insulation, and early machine-grade structure.
fw-conductive-networks-technology=Formalizes coil blocks, conduits, and field routing so expanding factories can move power and signals through custom FluxWorks hardware instead of vanilla stopgaps.
fw-optical-instrumentation-technology=Develops the lens, diode, and sensing stack needed for precise routing, spectroscopy, and higher-end process control.
fw-sealed-systems-technology=Packages fragile internals into pressure-stable casings and regulators, making later machines resilient enough for aggressive fluids and thermal cycling.
fw-polymer-chemistry-technology=Brings resin and rubber into the component chain so seals, filters, and flexible electrical parts can join the main factory language.
fw-power-regulation-technology=Stabilizes the factory's higher-power hardware by introducing the regulators and buffers that keep later Flux machines from acting like improvised prototypes.
fw-energetic-compounds-technology=Expands the chemistry branch into blasting gel, propellant-adjacent materials, and harsher process media for industrial and military work.
fw-metallurgic-assemblies-technology=Pushes the fabrication layer toward reinforced hot-work components and foundry-ready assemblies for serious heavy industry.
fw-biosystems-engineering-technology=Builds the living-material branch around nutrient beds, spore handling, and Gleba-facing support hardware instead of treating biology as an afterthought.
fw-cryogenic-control-technology=Establishes thermal buffering and cryogenic handling, letting the factory move from basic fluids into tightly managed cold-spectrum processing.
fw-electromagnetic-architecture-technology=Turns high-end field control into a first-class engineering lane for resonance hardware, power routing, and precise late-machine internals.
fw-orbital-hardening-technology=Prepares FluxWorks infrastructure for sustained off-world deployment by hardening key hardware against vacuum, debris, and platform duty.
fw-promethium-stabilization-technology=Transforms trace promethium recovery into a practical industrial branch by teaching the conditioning and containment needed for real endgame use.
fw-industrial-expansion-technology=Acts as the bridge from early component work to true factory-scale infrastructure, widening where FluxWorks materials can replace vanilla assumptions.
fw-pressure-containment-technology=Turns the renamed lead-pipe baseline into a true pressure branch by unlocking steel pipe, long-run undergrounds, a tougher pump, and the first large industrial containment tank.
fw-bulk-logistics-technology=Builds the first real FluxWorks bulk-handling family with reinforced loaders, dense storage bodies, and warehouses that feel engineered instead of merely borrowed.
fw-network-logistics-technology=Connects the new bulk-handling lane to the factory's signal architecture, opening smarter storage variants and the express loader once routing discipline catches up.
fw-logistics-orchestration-technology=Pushes the logistics branch into late coordinated handling with advanced loaders, full-control network storage, and the huge tank for mature fluid hubs.
fw-petrochemical-engineering-technology=Formalizes heavier chemical plantwork around binders and refinery-adjacent process hardware, giving FluxWorks polymers a real industrial backbone.
fw-polymer-stabilization-technology=Pushes petrochemical work beyond a single glue recipe into stabilized elastomer stock that supports broader machine and seal families.
fw-hydraulic-systems-technology=Builds pressure-rated machinery and sealing hardware for fluid-heavy industrial equipment, opening the hydraulic layer that supports tougher process plants.
fw-fluid-control-architecture-technology=Turns hydraulic hardware into a true control branch with actuators, servo valves, and manifold logic for late fluid systems.
fw-isotope-conditioning-technology=Applies controlled atomic processing to produce denser isotopic stock for advanced reactor and power-system construction.
fw-reactor-doping-technology=Pushes isotopic engineering into true reactor-grade additives that support fusion-era and promethium-era hardware.
fw-actinide-recovery-technology=Turns spent reactor material into a recoverable process stream, giving the atomic branch a real recycling backbone instead of a dead-end fuel sink.
fw-reactor-instrumentation-technology=Builds the reactor-control and monitoring layer that ties the atomic branch back into the wider late nuclear stack without leaning on a separate specialist module family.
fw-comminution-technology=Establishes ore crushing as an early industrial backbone, unlocking improved yield routes and the first FluxWorks process chain branch.
fw-basic-separation-technology=Introduces the first simple sorting and recovery layer so crushed materials, salt, and carbon feedstock become practical industrial inputs instead of raw clutter.
fw-ore-crushing-technology=Pushes raw ore handling beyond simple mining so mixed deposits can be broken down into cleaner, more valuable intermediate streams.
fw-mineral-beneficiation-technology=Pushes early separation into more demanding mineral upgrading so silicon-rich deposits stay useful beyond the first crushing pass.
fw-flux-extraction-technology=Authorizes deployment of Flux Quarries after reaching orbital launch capability, formalizing large-scale extraction of shattered Flux source fragments from Rift fields.
fw-flux-mining-productivity-technology=Infinite late-game research that scales mining drill productivity, significantly increasing long-run Flux Rift output and overall extraction efficiency.
fw-glassworking-technology=Turns early sand output into practical industrial glass, giving the first crushing branch a clear material payoff and opening the road toward lenses, housings, and insulation.
fw-material-foundations-technology=Builds the first polymer and insulation layer that turns early chemistry and minerals into real fabricated stock.
fw-structural-fabrication-technology=Turns raw plates and basic processed materials into the first real FluxWorks structural parts for machines, housings, and durable assemblies.
fw-sealed-components-technology=Packages early beams, carbon, rubber, and mesh into tubes and filter bodies that make the next chemistry and machine tiers feel engineered instead of cobbled together.
fw-contact-casting-technology=Improves precision metal shaping so conductive and heat-managed contact surfaces stop being bottlenecks in advanced assembly lines.
fw-metals-fabrication-technology=Expands beam, tube, and formed-metal work into a broader manufacturing language that can support large machine bodies and dense part kits.
fw-circuit-foundry-technology=Brings substrates, carriers, and dense electronics hardware into FluxWorks fabrication, replacing off-the-shelf circuitry with native component chains.
fw-beam-engineering-technology=Specializes structural metalworking toward long-span beams and reinforced frames that anchor the heavier side of the production graph.
fw-conductive-assembly-technology=Refines bundled wiring, coils, and routed conductors so power-heavy and signal-heavy machines can scale without awkward material jumps.
fw-wafer-etching-technology=Moves precision electronics into true wafer work, opening the cleaner silicon side of late computation and sensing parts.
fw-electromechanical-systems-technology=Combines moving hardware with higher-end electronics to produce the dense actuator, sensor, and control bodies modern machines demand.
fw-signal-architecture-technology=Organizes advanced sensing and logic routing into a coherent systems layer, preparing the jump from component work to actual machine intelligence.
fw-computational-arrays-technology=Builds the large-scale processing stack behind high-end control, resonance calculations, and the more exotic parts of the FluxWorks endgame.
fw-material-refinement-technology=Upgrades broad material handling so lower-tier outputs can be purified, sorted, or reworked into better feedstocks before the real late-game machines arrive.
fw-instrumentation-technology=Develops the fine sensing, measurement, and feedback parts that keep more delicate Flux and chemistry operations stable.
fw-systems-integration-technology=Combines instrumentation, robotics, and power conversion into a unified high-tier machine architecture.
fw-advanced-fabrication-technology=Marks the point where FluxWorks manufacturing stops being a parts list and starts behaving like a coordinated advanced fabrication ecosystem.
fw-liquid-mining-technology=Bridges early ore processing into the first serious fluid work by unlocking mining-with-fluid plus the chlorine and washing routes right before the broader chemistry branch opens up.
fw-flux-catalysis-technology=Converts mined Rift fragments from an exotic resource into reusable catalysts and disciplined factory Flux, beginning the real chemical side of the mod's core loop.
fw-flux-yellow-catalysis-technology=Focuses the yellow spectrum on control-heavy chemistry, opening cleaner catalyst handling and more disciplined reactive processing.
fw-flux-stabilization-technology=Turns raw Flux handling into dependable industrial practice, making stabilized machine work and synthesis infrastructure possible.
fw-harvester-systems-technology=Turns Flux from a mined oddity into a practical factory layer by unlocking the Harvester and its core purple-flux ore upcycling and downcycling loop.
fw-flux-structuring-technology=Pushes stabilized Flux into deliberate crystal geometry and lattice work instead of treating it as a loose catalytic oddity.
fw-flux-red-energetics-technology=Develops the hotter, more violent red-spectrum side of Flux for fuels, thermal pressure, and heavy industrial reactions.
fw-flux-green-reclamation-technology=Defines the restorative green-spectrum lane around recovery, biological feed loops, and growth-oriented process recycling.
fw-flux-metallurgy-technology=Pushes red-spectrum Flux into heavy industry, opening the Arc Foundry and the hotter recast materials needed for late machines.
fw-harvester-head-item=Primary grading head for the Flux Harvester, built to keep transmutation, beneficiation, and downcycling stable inside one machine body.
fw-annealed-cermet-item=Red-flux tempered cermet stock reserved for hotter, harsher machine internals.
fw-resonance-substrate-item=Control substrate infused with stabilized Flux pathways for late-stage synthesis and resonance hardware.
fw-flux-harvester-item=Dedicated purple-flux transmutation building for pushing ores up the ladder and reclaiming Flux when you step them back down.
fw-arc-foundry-item=High-heat red-spectrum industrial furnace for advanced recasts and thermal reinforcement.
fw-synthesis-plant-item=Precision Flux integration machine for stabilized crystals, resonance parts, and promethium hardware.
fw-flux-harvester-entity=The main industrial ore-tier transmutation machine once simple crushing stops being enough. Feed it purple Flux to upgrade ores, or downcycle them to recover part of that Flux.
fw-arc-foundry-entity=Turns red Flux into practical heavy industry by annealing, recasting, and densifying durable process materials.
fw-synthesis-plant-entity=Where FluxWorks shifts from chemistry into tightly controlled synthesis of resonance, promethium, and endgame control assemblies.
fw-flux-harvester-recipe=Constructs a Flux Harvester from grading internals, pressure hardware, and mid-tier Flux machine parts.
fw-arc-foundry-recipe=Constructs an Arc Foundry from foundry liners, annealed cermet, smelter arrays, and regulated high-temperature hardware.
fw-synthesis-plant-recipe=Constructs a Synthesis Plant from stabilized Flux internals, precision routing parts, and dense control hardware.
fw-flux-condenser-recipe=Constructs a Flux Condenser from advanced Flux assemblies rather than raw base materials, keeping it in the late complex-manufacturing tier.
fw-resonance-assemblies-technology=Elevates Flux resonance from theory into real reusable hardware, especially the cells that tie multiple late-game systems together.
fw-flux-asteroid-harvesting-technology=Extends the Flux chain into orbit by refining Flux-tainted asteroid salvage into practical platform-side materials.
fw-flux-field-theory-technology=Formalizes field behavior at industrial scale, supporting the transition from strong Flux machines into genuinely strange endgame assemblies.
fw-aquilo-cryochemistry-technology=Brings the Flux chain into Aquilo-grade cold processing, moving the late cooling and cryogel branch onto true cryogenic machine work instead of generic chemistry.
fw-gleba-biochemistry-technology=Adapts FluxWorks biology for Gleba by combining living materials, nutrient recovery, and spore handling into a real biochamber-facing branch.
fw-flux-chemical-synthesis-technology=Turns field theory and catalyst handling into broad-spectrum industrial chemistry, bridging the gap between exotic Flux behavior and mainstream factory recipes.
fw-vulcanus-pyrochemistry-technology=Pushes the metallurgy branch into Vulcanus-scale heat and slag handling, making foundry-grade Flux materials part of the real late machine ladder.
fw-flux-reactive-slurries-technology=Develops unstable mixed-phase chemical loops where Flux stops being just a helper and becomes a core reaction driver.
fw-fulgora-electrochemistry-technology=Extends Flux control into Fulgora's electrical environment, opening charged materials and true electromagnetic-plant routing for the field branch.
fw-flux-green-cultivation-technology=Moves green Flux beyond recovery and into active cultivation, making it a true growth and propagation lane for late factories.
fw-flux-green-propagation-technology=Deepens the biological side of Flux into mass growth and renewal loops that can scale alongside the harsher industrial branches.
fw-flux-thermal-networks-technology=Connects red-spectrum heat work with managed cooling and distribution, turning isolated hot recipes into a coherent thermal infrastructure.
fw-superconductive-systems-technology=Fuses cryogenic control with electromagnetic architecture so the factory can support truly high-end field hardware and energy-dense utility systems.
fw-flux-phase-engineering-technology=Marks the shift from resonance hardware into phase-stable endgame assemblies where Flux is shaping logistics and machine behavior directly.
fw-flux-overdrive-technology=Pushes the stabilized late-game Flux stack into a harder-running endgame mode where throughput, containment, and energy density all climb together.
fw-fusion-lattices-technology=Brings fusion-grade structure and promethium-era durability into the Flux chain, supporting the heaviest endgame systems and cross-branch convergence.
fw-flux-convergence-technology=Represents the point where the separate Flux colors and planet-specific branches finally start behaving like one mature industrial language.
fw-origin-infrastructure-technology=Turns the Shattered Planet's late payoff into a real construction branch, opening the forge and the first origin-grade infrastructure parts.
fw-storm-megastructures-technology=Escalates the source-planet finale into giant storm-fed projects that only a mature bridgehead network could hope to sustain.
fw-origin-transcendence-technology=Pushes the branch beyond normal megaprojects into billion-scale flux forging and the final singularity monument that must be awakened on the Shattered Planet to finish the game.
fw-rift-harmonics-technology=Tunes the very late branch toward rift-scale control and long-distance stability, preparing the factory for the strangest logistics and orbital work in the mod.
fw-reactive-chemistry-productivity-technology=Unlocks controlled demolition and incendiary chemistry passes built around denser slurry and napalm handling.
fw-green-reclamation-productivity-technology=Unlocks a spoilage-heavy compost bloom that recovers bioflux instead of stopping at basic nutrient salvage.
fw-green-cultivation-productivity-technology=Unlocks dedicated Green Flux bloom routes for biolubricant and aquaculture production.
fw-green-propagation-productivity-technology=Unlocks managed seedbank routes for the regenerative side of the Green Flux chain.
fw-cryogenic-loop-productivity-technology=Unlocks closed-loop coolant recovery and improved cryogel finishing for Aquilo-grade chemistry.
fw-phase-assembly-productivity-technology=Unlocks calibrated resonance-cell and manifold assembly passes that recover catalysts more reliably.
fw-asteroid-refinement-productivity-technology=Unlocks a deeper asteroid sorting pass focused on cleaner matrix, crystal, and catalyst recovery.

