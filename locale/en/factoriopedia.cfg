[tips-and-tricks-item-description]
fluxworks-overview=[font=default-bold]Your first objective[/font]\nFind an [entity=fw-crystalised-flux] rift, place a [entity=fw-flux-quarry] directly over it, and automate its output. This unlocks the catalyst and stabilized-crystal chain that every later Flux system depends on.\n\n[font=default-bold]When progression stalls[/font]\nFollow the missing item backward in Factoriopedia. FluxWorks is built as connected material, machine, science, and planetary lanes; the visible shortage is often one permanent intermediate line upstream.
flux-rift-extraction=[font=default-bold]Placement rule[/font]\nThe [entity=fw-flux-quarry] is not a general miner. Its footprint must overlap [entity=fw-crystalised-flux], and it needs substantial power before it produces anything.\n\n[font=default-bold]Build for continuity[/font]\nBuffer the mined crystal, then feed permanent [item=fw-flux-catalyst] and [item=fw-stabilized-flux-crystal] lines. A quarry whose output belt is blocked stops the entire Flux branch.
shattered-flux-source=Flux Rifts are fragments of the Shattered Planet. The planet's vents provide the original source of all four Flux types.
flux-lore-and-spectra=[fluid=fw-purple-flux] handles matter and transmutation. [fluid=fw-yellow-flux] handles chemistry and process control. [fluid=fw-red-flux] handles heat, fuel, and power. [fluid=fw-green-flux] handles biological recovery and growth. Advanced recipes combine all four.
mixed-deposit-planning=[font=default-bold]Sort before processing[/font]\n[entity=fw-metallic-deposit], [entity=fw-mineral-deposit], and [entity=fw-carbonic-deposit] produce families of resources. Split every output immediately and give each one its own buffer; a full low-demand product must not block the ore you actually need.\n\nLeave room between the sorter and rail loading for crushers and beneficiation. Ship separated products, not an opaque mixed belt.
early-processing-bootstrap=[font=default-bold]Automate this order[/font]\n1. Crush iron and copper for the high-volume smelting lanes.\n2. Separate stone, carbon, and salt for glass and chemistry.\n3. Keep [item=glass], [item=fw-rubber-sheet], [item=pipe], and [item=fw-inline-filter] running continuously.\n\nThose shared materials unlock the first custom machines. Handcrafting them hides shortages until every new recipe appears blocked at once.
flux-processing-ladder=[font=default-bold]Machine ownership[/font]\n[entity=fw-flux-harvester]: Purple deconstruction, ore shifts, and recovery.\n[entity=fw-arc-foundry]: Red heat, cermets, and heavy metallurgy.\n[entity=fw-synthesis-plant]: stabilized multi-spectrum components and promethium work.\n[entity=fw-flux-condenser]: item destruction and Flux recovery only.\n\nIf a recipe is missing from a machine, check its category in Factoriopedia instead of adding more assemblers.
flux-synthesis-and-recovery=[font=default-bold]These machines run in opposite directions[/font]\nThe [entity=fw-synthesis-plant] spends prepared materials and Flux to manufacture advanced components. The [entity=fw-flux-condenser] accepts valued items directly into its intake, destroys them one by one, and outputs their evaluated Purple, Yellow, Red, and Green material. No recipe selection is required.\n\nGive every extractor output its own tank. If even one required color has nowhere to go, the intake pauses without destroying the next item.
promethium-ramp=[font=default-bold]Scale in three steps[/font]\n1. Secure continuous [item=fw-promethium-shard] delivery.\n2. Automate [item=fw-promethium-matrix] with dedicated resonance and planetary-material inputs.\n3. Only then feed rift stabilizers and origin hardware.\n\nA stalled matrix line is usually short on catalysts, lattices, or resonance cells—not promethium itself.
flux-orbital-salvage=FluxWorks also has a space-side salvage loop. [entity=remnant-beacon] attracts recoverable rocket remnants, and processed [item=rocket-chunk] gives platforms a way to reclaim advanced components instead of treating launches as pure waste.\n\nBasic crushing closes the orbital ammunition loop: metallic chunks provide iron and lead, while carbonic chunks provide carbon, coal, and salt for gunpowder. Advanced crushing widens that supply network with tin from metallic chunks; extra salt from carbonic chunks; and bauxite, titanium, and silicon ore from oxide chunks. Remnant salvage then covers the expensive aerospace edge pieces.
petrochem-and-hydraulics=The [entity=fw-petrochemical-facility] makes binders, elastomers, and seals. The [entity=fw-hydraulic-plant] makes pressure housings, regulators, and manifolds in efficient batches.
atomic-enrichment-loop=The [entity=fw-atomic-enricher] makes isotope matrices, fuel-pellet bundles, reactor dopants, and control hardware. Later recipes recover actinides from spent fuel and radioactive scrap.
deep-storage-and-rift-logistics=[font=default-bold]Storage first, transport second[/font]\nA [item=fw-phase-vault] stores one item; a [item=fw-spectral-reservoir] stores one fluid. Filter them, connect their circuit output, and use the visible buffer for inserters or pumps.\n\nRift exchange gates are paired links, not warehouses. Set the same link ID at both ends, select the destination surface, provide cycle power, and test with a small shipment before routing critical production through them.
green-flux-recovery=[font=default-bold]Protect the loop in this order[/font]\n1. Reclaim spoilage into useful feedstock.\n2. Maintain nutrients and living bioflux.\n3. Reserve seeds before enabling propagation.\n\nUse circuit conditions to disable optional consumers when the seed or nutrient buffer falls below its safety minimum. Bio Flux rewards a stable loop, not maximum instantaneous speed.
planetary-chemistry-rewards=Each Space Age planet now has two FluxWorks layers. First, its native machinery produces a distinct reward: [item=fw-aquilo-cryogel], [item=fw-gleba-spore-resin], [item=fw-fulgora-static-mesh], or [item=fw-vulcanus-slag-cermet]. Second, its symbiosis technology feeds back into a major Space Age reward.\n\nVulcanus symbiosis leads into turbo belts, Gleba symbiosis into stack inserters, Fulgora symbiosis into Tesla weapons, and the completed four-planet convergence into fusion power. These are no longer parallel trees; scaling each planetary FluxWorks factory is part of completing the corresponding Space Age branch.
thermal-and-superconductive-infrastructure=[technology=fw-superconductive-systems] combines Aquilo cooling, Fulgora electrical materials, and Fuel Flux heat control. Scale all three inputs for [item=superconductor] and [item=supercapacitor] production.
shattered-island-traversal=The Shattered Planet is divided by cliffs, fracture belts, and gaps. Build compact outposts near each vent and connect only the routes you need.
shattered-bridgeheads=Once [technology=fw-flux-convergence] lands, the Shattered Planet should stop behaving like a raw-fluid mining colony and start behaving like a network of bridgehead factories. The ion storm lets you upgrade cryogel, static mesh, slag cermet, and eventually superconductive hardware directly on the source surface.\n\nThat means the best shattered islands are not always the ones with the most room. They are the ones where a vent cluster, a survivable footprint, and a logistics link line up well enough to support a small specialized export base.
shattered-convergence-network=Use separate outposts for Matter, Chemical, Fuel, and Bio Flux. Combine their exports in recipes such as [recipe=fw-ion-storm-rift-stabilizer-convergence].
shattered-origin-projects=[entity=fw-shattered-convergence-array] begins Origin Project production. [entity=fw-origin-forge] builds its components. Place and fully charge [entity=fw-origin-singularity] on the Shattered Planet to win.
shattered-vent-biomes=On the Shattered Planet, terrain color is meant to tell you which Flux vent belongs there. Yellow shelves point toward yellow chemistry vents, red fracture land points toward red thermal vents, green growth shelves point toward green recovery vents, and purple resonance ground points toward purple structuring vents.\n\nIf you are scouting new islands, follow the color first. Matching each vent harvester to its biome is the core rule of the planet.
shattered-origin-revelation=[technology=fw-flux-convergence] reveals that Flux Rifts are fragments of the Shattered Planet. Its vents and storm recipes provide direct access to the source.
flux-convergence-and-rift-control=[technology=fw-flux-convergence] combines all four Flux types. Keep separate storage for each recovered fluid so one full output does not stop extraction.
finding-fluxworks-recipes=FluxWorks recipes are divided by what they do, not merely by when they unlock. Use the dedicated crafting tabs for Logistics, Production, Chemistry, Fabrication, Science, and Flux; then hover an ingredient and use Factoriopedia to trace its producers and consumers.\n\nIf a recipe seems missing, check its technology first. Many familiar vanilla technologies now depend on a FluxWorks material or science branch, so the next step may be in the neighboring branch rather than farther down the same vertical line.
reading-the-tech-weave=The technology tree is intentionally interwoven with Space Age. FluxWorks is not a separate tree to finish in isolation: material processing feeds vanilla production, planetary industries feed their native technologies, and domain sciences return as requirements throughout both trees.\n\nRead prerequisites from both directions. When a vanilla technology is blocked, inspect the attached FluxWorks prerequisite; when a FluxWorks technology is blocked, look for the vanilla machine or planetary capability it expects you to have built.
fluxworks-design-language=[font=default-bold]FluxWorks expands factory vocabulary[/font]\nThe mod adds permanent structural, control, chemical, thermal, biological, and Flux production families. These are not intended as one-time crafting tolls: beams, tubes, bearings, seals, substrates, sensors, regulators, and similar components should become buffered factory services.\n\nWhen a familiar recipe changes, ask what industrial capability the added component represents. A bearing means moving machinery, a signal conduit means control, a reinforced seal means fluid pressure, and a power regulator means sustained electrical load.
global-recipe-compatibility=[font=default-bold]Compatibility follows capabilities, not mod names[/font]\nFluxWorks examines loaded recipes and the prototypes their products place. Recognizable production machines, fluid systems, logistics, power equipment, control hardware, combat structures, modules, robots, and equipment can receive one fitting FluxWorks component.\n\nThe pass avoids tiny packing and conversion recipes, protects foundational bootstrap infrastructure, and respects the recipe-complexity ceiling. Use the startup setting to select Off, Conservative, or Broad integration when assembling a modpack.
settings-and-difficulty=[font=default-bold]Settings define ownership[/font]\nRecipe integration, world generation, crafting organization, planetary changes, and global compatibility can be adjusted independently at startup. Difficulty controls change coherent production families rather than only increasing every number.\n\nFor the intended overhaul, keep the recommended defaults. Modpack authors should disable an ownership surface when another overhaul must control it instead of patching individual recipes after loading.
how-flux-evaluation-works=[font=default-bold]Evaluation follows the final recipe graph[/font]\nFluxWorks reads the recipes that remain after compatibility and overhaul changes. It traces ingredient values, fluids, process time, output quantity, and process category to estimate the material value of a finished item. The least expensive trustworthy primary recipe becomes the recovery basis.\n\nEvaluation is not market price and does not measure usefulness. It answers a narrower question: how much recoverable spectrum material is credibly embodied in one item?
flux-valuation-confidence=[font=default-bold]Confidence controls extraction[/font]\n[color=180,220,255]Locked[/color] values are deliberate hard rules. [color=180,220,255]Anchored[/color] values come from reviewed reference materials. [color=180,220,255]Derived[/color] values follow a clean recipe made entirely from trustworthy inputs.\n\n[color=255,220,150]Estimated[/color] means the best available recipe is ambiguous. [color=255,190,120]Unknown[/color] means there is not enough economic evidence. Estimated and Unknown items remain in the intake instead of being destroyed for a guessed value.
why-extraction-is-unavailable=An item may be visible to the valuation system without being safe to destroy for Flux. Extraction is withheld for unknown or estimated values, stateful equipment, hidden tools, one-off control items, and recipes involving recycling, voiding, free outputs, unpacking, reversal, uncertain products, catalysts, or unpriced fluids.\n\nThis is intentional exploit protection, not a missing unlock. If a normal modded item is marked Unknown, its recipe family needs better compatibility evidence or a reviewed value anchor.
four-spectrum-evaluation=[font=default-bold]Material history plus process identity[/font]\nMost of an item's spectrum comes from its ingredients. The remaining process share describes what happened to them: metallurgy introduces [fluid=fw-red-flux], electronics and chemistry introduce [fluid=fw-yellow-flux], biological work introduces [fluid=fw-green-flux], and structural mass emphasizes [fluid=fw-purple-flux].\n\nKnown items may have authoritative spectrum declarations. Unknown modded prototypes are classified from capabilities such as fuel, energy use, circuits, spoilage, agriculture, storage, modules, temperature, and fluid chemistry.
recovery-efficiency-and-conservation=[font=default-bold]Extraction always loses value[/font]\nThe Flux Extractor is destructive recovery, not reversible matter duplication. Locked, Anchored, and Derived valuations use different recovery efficiencies, and difficulty adjusts the recovered budget. Productivity and quality multiplication are disabled.\n\nFlux colors also have different unit values. An energetic Red share therefore yields fewer fluid units than the same value held as Purple. The displayed mixture conserves the reduced recovery budget instead of quietly rewarding one spectrum more than another.
flux-surplus-policy=[font=default-bold]Recover exceptions, not your whole factory[/font]\nGood extraction inputs are obsolete machines, excess by-products, salvaged equipment, overproduced intermediates, and modded items whose original production line no longer has a useful sink. Keep direct mining, planetary industry, and ordinary component production as the main economy.\n\nIf a factory continuously crafts an item only to extract it, compare the ingredient value with the returned Flux. The one-way efficiency loss should make that loop a disposal route, not a source of free matter.
compatibility-and-unknown-items=[font=default-bold]Unknown is useful information[/font]\nLarge modpacks contain trophies, infinite resources, reversible containers, probabilistic chains, catalysts, and scripts whose true cost cannot be inferred safely. FluxWorks reports uncertainty instead of inventing authoritative-looking precision.\n\nWhen a mainstream item remains Unknown, record the item, its producing recipes, and the installed mod version. That is the useful compatibility report: it can become a reviewed anchor or a specific adapter without weakening safety for every other mod.
mixed-ore-bus-design=Mixed deposits reward a sorting district. Bring the raw family to one rail stop or belt corridor, split each product there, and buffer only after separation. This keeps uneven ore ratios from blocking every output at once.\n\nLeave room for crushers and later beneficiation beside the sorter. Shipping separated crushed ore is usually easier to scale than sending every mixed raw output directly into its own distant furnace line.
crushing-before-smelting=Direct smelting is useful for bootstrapping, but crushed recipes are the durable production route. Crushing improves yield, creates cleaner routing points, and gives later productivity bonuses a better place to act.\n\nStart with one crusher lane per high-volume metal. Keep a small direct-smelting bypass for emergencies, then expand crushing before furnace throughput becomes the bottleneck.
structural-intermediate-backbone=[item=fw-steel-beam], tubing, mesh, glass, rubber, seals, and composite panels recur across the mod. Treat them as factory infrastructure, not one-off ingredients.\n\nGive each family a permanent production block and a modest buffered output. When a new machine unlocks, this turns construction into an assembly problem instead of another expedition through six underbuilt precursor chains.
fluid-bus-and-reserves=Do not mix every Flux color into one cramped pipe corridor. Give Purple, Yellow, Red, and Green independent trunks, pumps, and circuit-readable reserve tanks. The colors often converge in late recipes, but their production rates and consumers remain very different.\n\nA useful control rule is to reserve a protected minimum for science and progression components, then permit optional high-volume processes only while storage is above that threshold.
domain-science-overview=[font=default-bold]Four packs, four factory checks[/font]\n[item=fw-industrial-methods-science-pack]: structural materials are automated.\n[item=fw-systems-analysis-science-pack]: sensors, signals, and electronics are automated.\n[item=fw-flux-theory-science-pack]: catalysts and stabilized Flux are automated.\n[item=fw-planetary-convergence-science-pack]: all planetary export lanes are operating.\n\nThese are recurring science packs, not one-time tolls. Put each on permanent production when it first unlocks. Advanced synthesis research may combine two disciplines, but routine technologies continue to use the pack that matches their field.
industrial-methods-science=[item=fw-industrial-methods-science-pack] is built from practical industrial output: structural stock, mesh, glass, and refined carbon. Its recipe is a check that the early material factory has become repeatable.\n\nIf production is unstable, scale the shared structural intermediates first. Those same lines build machines and later projects, so extra capacity is rarely wasted.
systems-analysis-science=[item=fw-systems-analysis-science-pack] combines sensing, signal routing, microelectronics, and electrical chemistry. It marks the point where isolated machines should become an instrumented factory.\n\nAutomate sensor packages and logic components beside circuits, and expose their buffers to the circuit network. Systems research and late logistics both draw heavily from this control-hardware backbone.
flux-theory-science=[item=fw-flux-theory-science-pack] consumes stabilized Flux products rather than raw rift material. A shortage usually means catalysts, stabilized crystals, resonance stock, or Matter Flux are still being produced as occasional batches.\n\nPromote those intermediates to permanent lines before scaling the pack. Flux Theory becomes a recurring requirement across advanced field, phase, synthesis, and thermal research.
planetary-convergence-science=[font=default-bold]Do not assemble this pack from one mixed request chest[/font]\n[item=fw-planetary-convergence-science-pack] requires the Vulcanus, Gleba, Fulgora, and Aquilo exports plus promethium and rift-control hardware. Give every import a separate buffer and circuit alarm.\n\nWhen production stops, the empty buffer identifies the planet or local component lane that failed; a mixed chest hides that information.
science-pack-lab-compatibility=FluxWorks domain packs are accepted by normal labs, biolabs, and supported overhaul labs. You do not need a separate decorative laboratory chain just to consume them.\n\nThe production challenge is upstream: keep each domain pack supplied alongside the vanilla packs required by the same technology. Use filtered science belts or logistics requests so one new pack does not evict an older requirement.
progression-projects=[font=default-bold]Four domain sciences, four permanent milestones[/font]\nIndustrial Operations consumes Industrial Methods Science. Autonomous Logistics adds Systems Analysis. Spectrum Process Control adds Flux Theory. Planetary Convergence Mastery closes the chain with Convergence Science and all four planetary science packs.\n\nThese are normal laboratory technologies: automate the matching science pack, research the milestone, and receive the permanent reward directly.
industrial-district-charter=[technology=fw-industrial-district-project] is the first milestone in the chain. It permanently improves mining productivity and inserter capacity through sustained Industrial Methods research.
autonomous-network-charter=[technology=fw-autonomous-network-project] follows Industrial Operations and applies Systems Analysis to permanent robot speed and cargo-capacity improvements.
spectrum-control-charter=[technology=fw-spectrum-control-project] follows Autonomous Logistics and converts Flux Theory into permanent productivity for catalysts, stabilized crystals, and condensed matrices.
convergence-directive=[technology=fw-convergence-directive-project] is the final milestone. It combines Planetary Convergence Science with every planetary science discipline and permanently improves laboratories, mining, and robot speed.
purple-flux-discipline=[fluid=fw-purple-flux] represents material memory and phase structure. Matter Flux processes deconstruct solids, shift material tiers, stabilize crystals, and support universal recovery or deep storage.\n\nWhen Matter Flux demand spikes, inspect the quarry-to-catalyst path first. Raw rift output, cleanup capacity, and stabilized intermediates should scale together.
yellow-flux-discipline=[fluid=fw-yellow-flux] represents imposed chemical and electrical order. It belongs around beneficiation, precision chemistry, polymers, lubrication, control substrates, and Fulgora-style field processes.\n\nYellow factories benefit from careful fluid ratios. Use pumps and small controlled buffers so one hungry conditioning recipe cannot drain the acids or reactive feedstocks needed by every neighboring process.
red-flux-discipline=[fluid=fw-red-flux] represents energetic drive. It is generated from fuel-dense material and spent on flash smelting, cermets, dense fuels, thermal systems, and fusion-facing infrastructure.\n\nBuild Red production near fuel handling and high-power machines. Its consumers tend to be bursty, so accumulator capacity and a generous fluid reserve matter almost as much as average production rate.
green-flux-discipline=[fluid=fw-green-flux] represents regeneration. It converts spoilage and living stock into recovery, cultivation, propagation, and seed security.\n\nDesign Green lines as loops: prioritize recovery that prevents waste, then cultivation that replaces feedstock, and only then optional high-volume biological products.
machine-recipe-ownership=The [entity=fw-flux-harvester] owns early deconstruction and material shifts. The [entity=fw-arc-foundry] owns hot Red metallurgy. The [entity=fw-synthesis-plant] owns precise multi-spectrum manufacturing, while the [entity=fw-flux-condenser] only destroys items to recover their evaluated Flux.\n\nIf a recipe cannot run in a familiar assembler, its color and purpose usually identify the intended machine.
flux-productivity-boundaries=Not every Flux recipe accepts ordinary productivity. Conversion and recovery routes are restricted where a generic bonus would create a loop, while dedicated research effects improve carefully chosen foundational recipes.\n\nUse the recipe tooltip as the authority. When modules are rejected, improve upstream supply, quality, machine speed, or unlock the matching process-mastery and progression-project bonuses.
vulcanus-flux-route=Vulcanus combines molten metallurgy with Fuel Flux to produce [item=fw-vulcanus-slag-cermet]. This branch rewards a compact foundry district with abundant heat, molten-metal throughput, and durable Fuel Flux reserves.\n\nIts symbiosis reconnects to the native Vulcanus progression, so exporting the capstone is useful both for convergence recipes and for completing the wider technology weave.
gleba-flux-route=Gleba combines biological processing with Bio Flux to produce [item=fw-gleba-spore-resin]. Stabilize nutrient and spoilage recovery before chasing maximum capstone output.\n\nA resilient loop beats a fast fragile one: buffer seeds separately, recycle spoilage continuously, and let circuit conditions reduce consumption when the regeneration reserve is low.
fulgora-flux-route=Fulgora combines scrap-derived materials, field chemistry, and Chemical Flux to produce [item=fw-fulgora-static-mesh]. Sort scrap at scale and protect the holmium and electrolyte streams needed by higher-value processes.\n\nThe branch feeds electromagnetic symbiosis and later convergence hardware, so static mesh should become a scheduled export rather than an occasional hand-carried batch.
aquilo-flux-route=Aquilo combines deep cooling, fluoroketone control, and Matter Flux to produce [item=fw-aquilo-cryogel]. Heat management remains part of the puzzle: a recipe being unlocked does not mean an exposed cold factory will stay operational.\n\nSeparate survival heat from process heat, buffer cryogenic fluids, and export cryogel steadily before large convergence recipes begin consuming it in bursts.
preparing-the-shattered-expedition=[technology=fw-shattered-expedition-planning] begins a logistics campaign, not a one-way sightseeing trip. Stock platform repairs, foundations, power, construction robots, circuit hardware, and enough diverse production equipment to establish specialized bridgeheads.\n\nDo not rely on one giant mixed cargo chest. Group landing supplies by function so damage or an early shortage does not strand the equipment needed to bootstrap everything else.
shattered-network-logistics=[technology=fw-shattered-network-logistics] expects several hostile island factories to cooperate. Give each bridgehead a narrow responsibility, local reserve, and explicit import/export contract.\n\nCircuit-readable deep storage and rift logistics are strongest here. Move curated materials between islands; avoid recreating an opaque universal bus across terrain designed to break it apart.
factory-scaling-checklist=When progression stalls, check five layers in order: raw deposits and Flux extraction; crushed and conditioned feedstocks; structural and control intermediates; the four domain sciences; then planetary exports and convergence hardware.\n\nMeasure buffers instead of guessing. The empty item is often only the visible victim—the actual constraint may be two recipes upstream, a drained Flux color, insufficient machine ownership, or a planetary shipment that never received a minimum reserve.
