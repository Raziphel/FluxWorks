[recipe-description]
fw-foundry-folio=Consolidate local calibration records into an industrial folio so the endgame Forge can process all available regions without impossible ingredient slots.
fw-foundry-operation-calidus=Produce structural mesh alongside a Calidus calibration record from genuine local material and Yellow Flux.
fw-foundry-operation-solaris=Temper refractory composites and archive a Solaris calibration using Red Flux and volcanic materials.
fw-foundry-operation-nyxaris=Regenerate biological resin and record a living factory process using Green Flux.
fw-foundry-operation-vibrant=Align resonance substrates using local electromagnetic materials and Purple Flux.
fw-foundry-operation-vespera=Manufacture protected cryogenic controls while preserving an Aquilo-grade calibration record.
fw-foundry-operation-beetlejuice=Recover precision quantum assemblies from late-system resources and Purple Flux.
fw-foundry-operation-umbra=Stabilize phase-manifold hardware with local Umbra materials and the full Convergence discipline.
fw-foundry-atlas-convergence=Compile physical records from at least four installed Razi systems into two folios, then bring those folios to the Convergence Forge. The Atlas turns distant industrial experience into tangible manufacturing output.
