[entity-description]
fw-crystalised-flux=Unstable crystalline Flux deposit. These rifts are the earliest accessible fragments of the Shattered Planet's Flux-rich crust and are best harvested with a Flux Quarry.
fw-flux-quarry=Powered mining platform for Flux Rift deposits.
fw-metallic-deposit=Mixed metallic seam with iron, copper, lead, and tin-bearing ores, presented with a more familiar iron-patch profile.
fw-mineral-deposit=Layered mineral seam rich in bauxite and silicon-bearing rock, with trace titanium and lighter stone impurity.
fw-carbonic-deposit=Dark mixed seam containing coal and a stronger salt-bearing residue for chemical processing.
fw-silica-vein=Silicon-rich seam of pale sedimentary rock.
fw-promethium-impact=Impact-scarred shard field with only trace promethium content per tile, but enough total material to justify large-scale extraction.
fw-flux-harvester=Industrial purple-flux transmutation plant for upgrading ore tiers and reclaiming part of that Flux when you downcycle them again.
fw-arc-foundry=Fuel-spectrum thermal machine used for annealing, recasting, and other high-energy industrial material work.
fw-synthesis-plant=Late-stage precision machine built for stabilized Flux devices, resonance assemblies, and promethium conditioning.
fw-petrochemical-facility=Processes polymers, chlorine, sulfur, and explosives.
fw-hydraulic-plant=Builds the reinforced hydraulic parts used by later machines and utility structures.
fw-atomic-enricher=Processes radioactive stock into denser and more specialized isotopic assemblies for advanced power hardware.
remnant-beacon=An orbital beacon that attracts used rocket remnants. Platforms with a powered beacon are prioritized for remnant spawns.\nRecommended for stationary platforms with stable power.
fw-flux-condenser=One-way reclamation machine that evaluates an item, consumes 7.5 MW while processing, destroys it, and separates its recoverable material into colored Flux outputs.
fw-shattered-convergence-array=Storm-locked capstone assembly machine that only works on the Shattered Planet during full ion-storm conditions.
fw-phase-vault=Compresses one item type into a powered deep reserve while keeping a practical front buffer available for belts, bots, and manual access.
fw-spectral-reservoir=Stores one fluid in a powered deep reserve, preserving a practical front tank and the retained fluid temperature for later withdrawal.
fw-rift-exchange-gate=Acts as a powered logistics teleporter. Set a destination surface, optional link ID, and target state, then charge a full cycle to exchange inventories with a matched remote gate.
fw-rift-exchange-fluid-gate=Acts as a powered fluid teleporter. Set a destination surface, optional link ID, and target state, then charge a full cycle to exchange stored fluids with a matched remote gate.
fw-origin-forge=Late-game Shattered Planet forge for building origin-grade structures and megaproject parts.
fw-origin-singularity=Final Shattered Planet megastructure. Charge it during a storm to win.
fw-phase-vault-combinator=Hidden circuit helper that outputs the stored item count of its linked Deep Storage Unit.
fw-spectral-reservoir-combinator=Hidden circuit helper that outputs the stored fluid count of its linked Fluid Storage Unit.
fw-phase-vault-power-interface=Hidden power sink used to scale the Deep Storage Unit's energy draw with total stored volume.
fw-spectral-reservoir-power-interface=Hidden power sink used to scale the Fluid Storage Unit's energy draw with total stored fluid volume.
fw-rift-exchange-power-interface=Hidden power sink used to charge a Rift Exchange Gate through a full teleportation cycle.
fw-rift-exchange-fluid-power-interface=Hidden power sink used to charge a Rift Exchange Fluid Gate through a full teleportation cycle.
fw-shattered-yellow-flux-vent=Chemical-spectrum vent punched through dry suspended crust. It tends to cluster in chemistry-leaning island chains and directly feeds catalyst-heavy synthesis.
fw-shattered-red-flux-vent=Fuel-spectrum vent that bleeds hot energetic Flux through volcanic fracture islands hanging over open void. Scarcer, harsher, and more common in the planet's thermal belts.
fw-shattered-green-flux-vent=Bio-spectrum vent where regenerative Flux seeps up through calmer floating shelves, often turning isolated bridgeheads into biological recovery pockets.
fw-shattered-purple-flux-vent=Matter-spectrum vent that condenses structured Flux out of the ion storm, concentrating around the coldest resonance islands and the sharpest broken crests.
fw-flux-asteroid=An unstable Flux-infused asteroid with a volatile crystalline core.
fw-flux-asteroid-chunk=Can be crushed to recover concentrated Flux products.

