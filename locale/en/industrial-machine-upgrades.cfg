[entity-description]
fw-industrial-harvester=Industrial District Project reward. A faster Flux Harvester for large-scale mineral processing and spectrum recovery, now supporting quality modules. Retains the original harvester's fluid connections and footprint.
fw-precision-synthesis-plant=Autonomous Network Project reward. High-throughput precision reactor with six module slots for advanced Flux processes. Supports the same recipes as the original Synthesis Plant.
fw-chromatic-arc-foundry=Spectrum Control Project reward. Industrial-scale foundry with enhanced throughput and six module slots. All original Arc Foundry recipes remain available.
fw-convergence-synthesis-plant=Convergence Directive Project reward. Endgame synthesis plant with seven module slots and exceptionally high throughput. Accepts every recipe its predecessors could craft.
