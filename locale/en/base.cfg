[mod-setting-description]
fw-balance-flux-core-difficulty=Easy: Broadly lightens FluxWorks-native recipe ingredients.\nNormal: Uses the standard FluxWorks core ladder. [color=red]RECOMMENDED[/color]\nHard: Broadly increases FluxWorks-native recipe ingredient pressure.
fw-balance-harvesting-difficulty=Easy: Makes harvesting families like crushing, extraction, and early flux acquisition cheaper.\nNormal: Leaves harvesting at standard FluxWorks balance. [color=red]RECOMMENDED[/color]\nHard: Pushes harvesting chains to demand more infrastructure and input volume.
fw-balance-synthesis-difficulty=Easy: Softens midgame synthesis bottlenecks and material conversion chains.\nNormal: Uses the standard synthesis balance. [color=red]RECOMMENDED[/color]\nHard: Heavily increases synthesis chain demands, especially where crafted intermediates stack.
fw-balance-condensing-difficulty=Easy: Makes condensing loops and late flux transformations more forgiving.\nNormal: Uses the standard condensing balance. [color=red]RECOMMENDED[/color]\nHard: Makes condensing and endgame flux conversion meaningfully more expensive.
fw-balance-petrochemistry-difficulty=Easy: Reduces ingredient pressure across FluxWorks petrochemical chains.\nNormal: Leaves petrochemistry at standard FluxWorks balance. [color=red]RECOMMENDED[/color]\nHard: Increases the cost of petrochemical refinement and derivative products.
fw-balance-hydraulics-difficulty=Easy: Makes hydraulic components, manifolds, and fluid-control machinery easier to field.\nNormal: Uses the standard hydraulics balance. [color=red]RECOMMENDED[/color]\nHard: Pushes hydraulic recipes harder, especially where pressure and control hardware stack.
fw-balance-atomic-enrichment-difficulty=Easy: Reduces the cost of enriched nuclear and isotope-oriented FluxWorks recipes.\nNormal: Uses the standard atomic enrichment balance. [color=red]RECOMMENDED[/color]\nHard: Raises the cost of late nuclear intermediates and enrichment chains noticeably.
fw-balance-integrated-recipes-difficulty=Easy: Keeps integrated vanilla and Space Age recipes lighter when they pick up FluxWorks parts.\nNormal: Uses the standard integration balance. [color=red]RECOMMENDED[/color]\nHard: Makes integrated external recipes respect the full cost of FluxWorks componentization.
fw-balance-science-recipes-difficulty=Easy: Keeps science pack ingredient pressure softer while FluxWorks integrations stay lighter.\nNormal: Uses the standard science recipe balance. [color=red]RECOMMENDED[/color]\nHard: Makes science packs more demanding so research pacing tracks a tougher factory.
fw-balance-fluid-systems-difficulty=Easy: Makes pumps, pipes, thermal hardware, refineries, and similar fluid systems cheaper when they use FluxWorks parts.\nNormal: Leaves fluid systems at the standard integrated balance. [color=red]RECOMMENDED[/color]\nHard: Increases fluid and thermal infrastructure demands.
fw-balance-control-systems-difficulty=Easy: Makes poles, combinators, radar, signals, and similar control hardware cheaper when they use FluxWorks electronics.\nNormal: Leaves control systems at the standard integrated balance. [color=red]RECOMMENDED[/color]\nHard: Increases electronics and control-network recipe pressure.
fw-balance-late-machines-difficulty=Easy: Softens endgame machine, armor, reactor, and elite hardware costs.\nNormal: Uses the standard late-game machine balance. [color=red]RECOMMENDED[/color]\nHard: Makes late machines and premium hardware noticeably more expensive.
fw-balance-orbital-recipes-difficulty=Easy: Reduces rocket, platform, orbital, and cargo-launch costs that use FluxWorks aerospace parts.\nNormal: Uses the standard orbital balance. [color=red]RECOMMENDED[/color]\nHard: Significantly increases orbital and launch-chain costs.
fw-balance-crafting-time-difficulty=Easy: Shortens harder FluxWorks crafting chains and their integrated late-game partners.\nNormal: Keeps crafting times at the standard FluxWorks pacing. [color=red]RECOMMENDED[/color]\nHard: Extends demanding chains so throughput planning matters more.
fw-worldgen-metallic-deposit-profile=Sparse: Metallic deposits show up less often and in lighter seams.\nStandard: Uses the default mixed-metal worldgen. [color=red]RECOMMENDED[/color]\nAbundant: Metallic deposits appear more often, denser, and richer.
fw-worldgen-mineral-deposit-profile=Sparse: Mineral deposits are rarer and lighter, stretching bauxite and silicon progression.\nStandard: Uses the default mixed-mineral worldgen. [color=red]RECOMMENDED[/color]\nAbundant: Mineral deposits are more common, richer, and easier to scale from.
fw-worldgen-carbonic-deposit-profile=Sparse: Carbonic deposits appear less often and yield leaner coal-salt seams.\nStandard: Uses the default carbonic worldgen. [color=red]RECOMMENDED[/color]\nAbundant: Carbonic deposits are more common and richer, making chemical bootstrapping easier.
fw-worldgen-silica-vein-profile=Sparse: Silica veins stay rare and more exploratory.\nStandard: Uses the default standalone silica worldgen. [color=red]RECOMMENDED[/color]\nAbundant: Silica veins appear more often and in denser patches.
fw-worldgen-salt-profile=Sparse: Salt patches are lighter and less common, especially on wet coastal maps.\nStandard: Uses the default salt worldgen. [color=red]RECOMMENDED[/color]\nAbundant: Salt seams are more frequent and more rewarding to exploit.
fw-worldgen-enable-legacy-standalone-ores=Yes: Standalone lead, bauxite, and titanium patches can spawn alongside FluxWorks mixed deposits.\nNo: Nauvis stays focused on mixed deposits, with those ores mostly delivered through compound seams. [color=red]RECOMMENDED[/color]
fw-worldgen-lead-ore-profile=Sparse: Standalone lead patches, when enabled, are rarer and weaker.\nStandard: Uses the default standalone lead worldgen.\nAbundant: Standalone lead patches are more common and richer.
fw-worldgen-bauxite-ore-profile=Sparse: Standalone bauxite patches, when enabled, are rarer and weaker.\nStandard: Uses the default standalone bauxite worldgen.\nAbundant: Standalone bauxite patches are more common and richer.
fw-worldgen-titanium-ore-profile=Sparse: Standalone titanium patches, when enabled, are rarer and weaker.\nStandard: Uses the default standalone titanium worldgen.\nAbundant: Standalone titanium patches are more common and richer.
fw-worldgen-enable-promethium-impacts=Yes: Rare promethium impact seams can appear when the relevant late-game content exists. [color=red]RECOMMENDED[/color]\nNo: Promethium impacts are removed from worldgen even if promethium content is present.
fw-worldgen-promethium-impact-profile=Sparse: Promethium impacts stay extremely rare and light.\nStandard: Uses the default promethium impact worldgen. [color=red]RECOMMENDED[/color]\nAbundant: Promethium impacts are still rare, but noticeably more generous when they appear.
fw-enable-recipe-integration=Yes: FluxWorks components are threaded through vanilla and Space Age recipes where they fit the item family. [color=red]RECOMMENDED[/color]\nNo: FluxWorks keeps more of its recipe chains isolated and skips the broad integration pass.
fw-enable-core-material-replacements=Yes: Many recipe families replace raw vanilla basics with FluxWorks fabricated components where it makes sense. [color=red]RECOMMENDED[/color]\nNo: Those recipes keep more vanilla-style foundational ingredients.
fw-enable-combat-recipe-integration=Yes: Combat recipes pick up FluxWorks ballistic, sensing, and defensive materials where appropriate. [color=red]RECOMMENDED[/color]\nNo: Combat branches stay closer to default ingredient structure.
fw-enable-orbital-and-planetary-integration=Yes: Space Age planetary hardware and orbital structures pick up FluxWorks aerospace and planetary materials. [color=red]RECOMMENDED[/color]\nNo: The deeper orbital and planetary integration pass is skipped.
fw-enable-fulgora-scrap-integration=Yes: Fulgora scrap recycling picks up a FluxWorks-flavored output table with late electrical and industrial components. [color=red]RECOMMENDED[/color]\nNo: Scrap recycling stays closer to default Space Age behavior.
fw-enable-machine-part-rehoming=Yes: Late FluxWorks parts are pushed into synthesis and condensing machine lanes so those machines own the endgame chain. [color=red]RECOMMENDED[/color]\nNo: Those late parts keep their earlier routing.
fw-enable-crafting-tab-reorganization=Yes: FluxWorks reorganizes many vanilla, Space Age, and modded recipes into the custom crafting tabs. [color=red]RECOMMENDED[/color]\nNo: Recipes stay closer to their default crafting groups.
fw-tab-logistics-organization=Yes: Belts, inserters, rails, storage, poles, and circuit-adjacent logistics are cleaned up into clearer logistics subgroups. [color=red]RECOMMENDED[/color]\nNo: Those logistics families stay closer to default groups while the other FluxWorks tabs can still reorganize separately.
fw-tab-production-organization=Yes: Mining, furnaces, assemblers, chemistry machines, and specialized production buildings are reorganized into cleaner production lanes. [color=red]RECOMMENDED[/color]\nNo: Those production families stay closer to default groups while the other FluxWorks tabs can still reorganize separately.
fw-tab-science-organization=Yes: Only science packs and labs are gathered into the FluxWorks science tab. [color=red]RECOMMENDED[/color]\nNo: They stay closer to default crafting groups.
fw-tab-bioprocessing-organization=Yes: Biological items, machines, and recipes are gathered into the FluxWorks bioprocessing tabs. [color=red]RECOMMENDED[/color]\nNo: They stay closer to default groups.
fw-tab-energy-organization=Yes: Power generation, thermal hardware, and related recipes are gathered into the FluxWorks energy tab. [color=red]RECOMMENDED[/color]\nNo: They stay closer to default groups.
fw-tab-chemistry-organization=Yes: Chemistry materials, fluids, machines, and processing chains are grouped into FluxWorks chemistry tabs. [color=red]RECOMMENDED[/color]\nNo: They stay closer to vanilla and Space Age groups.
fw-tab-flux-organization=Yes: Flux fluids, machines, and endgame flux systems are grouped into Flux tabs. [color=red]RECOMMENDED[/color]\nNo: Flux-specific recipes keep more of their original placement.
fw-tab-fabrication-organization=Yes: Fabrication buildings and related recipes move into the dedicated fabrication tab. [color=red]RECOMMENDED[/color]\nNo: Fabrication machines stay closer to default groups.
enable-incomplete-rocket-parts=Yes: Rockets are staged through incomplete rocket parts, making the launch chain more deliberate and less exploitable. [color=red]RECOMMENDED[/color]\nNo: Rockets use a simpler vanilla-style path.
enable-incomplete-rocket-parts-productivity=Yes: Productivity modules affect incomplete rocket parts, making rocket-part production much stronger.\nNo: Productivity does not affect incomplete rocket parts, keeping the rocket loop more controlled. [color=red]RECOMMENDED[/color]
fw-memory-unit-power-usage=Controls how aggressively Deep Storage Units and Fluid Storage Units scale their power drain with stored volume. Formula: [font=default-small]1MW + (ceil(stored amount / divisor) ^ 0.35) * multiplier[/font]

