[mod-setting-name]
fw-enable-k2so-integration=[color=green][font=heading-2]Compatibility[/font][/color] Krastorio 2 Spaced Out integration
fw-enable-early-domain-science-gates=[color=cyan][font=heading-2]Legacy overhaul[/font][/color] Require early FluxWorks science for main progression
fw-enable-early-industry-overhaul=[color=cyan][font=heading-2]Legacy overhaul[/font][/color] Move the Space Age Crusher into the early industry branch
fw-enable-legacy-technology-overhaul=[color=cyan][font=heading-2]Legacy overhaul[/font][/color] Weave FluxWorks into base technology gates
fw-enable-asteroid-recipe-overrides=[color=cyan][font=heading-2]Legacy overhaul[/font][/color] Replace Space Age asteroid crushing yields

[mod-setting-description]
fw-enable-k2so-integration=When Krastorio 2 Spaced Out is installed, connect its advanced technology cards, imersite, matter engineering, and advanced components to late FluxWorks progression. Never changes K2SO's own recipe definitions.
fw-enable-early-domain-science-gates=Require Industrial Methods and Systems Analysis science packs throughout FluxWorks production and research. When disabled, they are optional factory-upgrade sciences, while Flux Theory and Planetary Convergence still gate late progression.
fw-enable-early-industry-overhaul=Re-enable the original FluxWorks Nauvis Crusher bootstrap and sand/glass triggers. Disabled by default, so the Space Age Crusher stays with its normal technology.
fw-enable-legacy-technology-overhaul=Re-enable FluxWorks prerequisites on existing Space Age technologies and add domain science to non-FluxWorks research. Disabled by default to preserve the original technology progression.
fw-enable-asteroid-recipe-overrides=Replace the original Space Age asteroid crushing results with FluxWorks' expanded ore catalog. Disabled by default to preserve original asteroid yields.

