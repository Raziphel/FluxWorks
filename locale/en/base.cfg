[recipe-description]
fw-industrial-methods-science-pack=Turn structural stock, mesh, glass, and refined carbon into a formal industrial research discipline.
fw-systems-analysis-science-pack=Instrument a working control assembly deeply enough to produce reusable systems-analysis data.
fw-flux-theory-science-pack=Stabilize catalysts, resonance material, and Purple Flux into a laboratory-safe model of Flux behavior.
fw-planetary-convergence-science-pack=Combine every planetary capstone with promethium and rift-control hardware into one endgame science package.
fw-industrial-district-charter=Commission the first Major Research Project. Crafting it completes the project automatically; retain the resulting charter for the next project.
fw-autonomous-network-charter=Consume the Industrial District Charter to commission the network project. Crafting it completes the project automatically and produces the charter required by Spectrum Control.
fw-spectrum-control-charter=Consume the Autonomous Network Charter to commission the Flux-control project. Crafting it completes the project automatically and produces the charter required by Convergence.
fw-convergence-directive=Consume the Spectrum Control Charter to commission the final project. Crafting it completes the project automatically and leaves a commemorative capstone directive.
fw-shattered-red-bridgehead-forging=Forges Vulcanus-grade slag cermet from cermet, tungsten, calcite, molten iron, and Red Flux without consuming slag cermet as seed stock.
fw-shattered-green-bridgehead-cultivation=Grows Gleba-grade spore resin from bioflux, jelly, resin, carbon fiber, and Green Flux without consuming finished spore resin.
fw-shattered-yellow-bridgehead-reclamation=Builds Fulgora-grade static mesh from metal mesh, holmium, superconductors, solution, and Yellow Flux without recycling finished static mesh.
fw-shattered-purple-bridgehead-annealing=Produces Aquilo-grade cryogel from ice, lithium, cryogenic hardware, fluoroketone, and Purple Flux without consuming finished cryogel.
fw-shattered-vent-spectrum-condensation=Condenses all four vent spectra into a productive batch of converged Flux matrices.
fw-shattered-rift-coupler-array=Assembles rift couplers from model lattices, quantum control, phase anchors, and entanglement hardware without consuming an existing coupler.
fw-shattered-origin-survey-lattice=Builds a model lattice from quantum computers, Flux lattices, stabilizers, and Promethium survey hardware without consuming a model lattice.
fw-ion-storm-harmonic-core=Forges a harmonic lattice core from origin linings, storm-spine segments, model lattices, Promethium hardware, and all four Flux spectra.
fw-orbital-flux-chunk-sorting=Use Yellow Flux field control to separate metallic asteroid structure more precisely and occasionally preserve the source chunk.
fw-vulcanus-red-carbide-sintering=Drive tungsten and carbon together under a Red Flux thermal field for denser carbide output.
fw-vulcanus-flux-casting=Combine Vulcanus molten metals, FluxWorks cermet, and Red Flux into a high-yield low-density casting pass.
fw-gleba-green-carbon-fiber-cultivation=Use Green Flux to grow a reinforced carbon-fiber matrix from filtered Gleba biomass.
