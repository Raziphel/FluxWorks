[mod-setting-description]
enable-incomplete-rocket-parts=Changes how rockets are constructed.\nPrimarily a balance setting, because disabled mode can turn launches into an effectively infinite processing-unit and LDS loop.\nRecommended setting is enabled.
enable-incomplete-rocket-parts-productivity=Allows productivity on incomplete rocket parts. This can be extremely strong with high-tier modules.\nRecommended setting is disabled.

