[mod-setting-name]
fw-rp-industrial-depth=[color=182,132,255]Industrial Extension[/color]  •  Factory Depth
fw-rp-industrial-power=[color=255,178,94]Industrial Extension[/color]  •  Project Machine Power

[mod-setting-description]
fw-rp-industrial-depth=Core retains the original fourteen Spectrum Industries processes. Expanded adds eight optional industrial recipes, using existing machines and researched technologies. No mandatory chapter gates.
fw-rp-industrial-power=Changes the electricity use of the four Industrial Project machine upgrades only. Efficient is 25% less, Standard preserves the normal amount, and Demanding is 30% more. Does not affect other mods' machines.

