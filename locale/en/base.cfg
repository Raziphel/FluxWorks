[fluid-description]
fw-purple-flux=Material-memory flux refined from Rift crystal and deconstructed solids. Purple governs structure, ore transmutation, phase storage, and the conversion of finished matter back into reusable spectrum mass.
fw-yellow-flux=Chemical-ordering flux produced from reactive chemistry stock and used to bind catalysts, reorganize intermediates, and push industrial chemistry into line like a controlled imitation of natural law.
fw-red-flux=Thermal-drive flux produced from fuel-dense stock and used to condense energy value, harden hot materials, and feed high-intensity industrial reactions without letting that source violence spill everywhere at once.
fw-green-flux=Regenerative bio flux produced from living or decaying biomass and used to recover spoilage, stabilize feedstock, and push growth back into useful output by imitating the restorative side of living systems.
fw-chlorine=Industrial chlorine stream used for polymer, sulfur, acid, and explosive processing.
fw-latex=Industrial polymer emulsion used as a precursor for resin chemistry and high-yield rubber processing.
fw-blasting-gel=Stabilized reactive gel used for advanced demolition and high-energy chemical explosive synthesis.
fw-napalm=Adhesive incendiary slurry prepared for sustained turret fire and area denial.

