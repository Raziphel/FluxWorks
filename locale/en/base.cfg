[recipe-description]
fw-reactive-slurry-focusing=Produces twice as much demolition gel from a controlled batch.
fw-gelled-napalm-mixing=Produces a larger napalm batch with additional Flux processing.
fw-green-flux-compost-bloom=Recovers bioflux from spoilage and a prepared nutrient bed.
fw-green-flux-biolubricant-bloom=Produces a large biolubricant batch with Bio Flux.
fw-green-flux-aquaculture-bloom=Produces extra fish from Bio Flux aquaculture.
fw-green-flux-seedbanking=Produces extra seeds from bioflux-supported cultivation.
fw-spectral-coolant-recycling=Recovers cold fluoroketone and part of the cryogel input.
fw-aquilo-cryogel-annealing=Produces cryogel with a chance to recover thermal hardware.
fw-flux-resonance-cell-calibration=Produces resonance cells with catalyst recovery.
fw-flux-phase-manifold-calibration=Produces phase manifolds with component recovery.
fw-flux-asteroid-core-sorting=Sorts asteroid cores into crystals, catalysts, and matrices.
fw-vulcanus-lead-fractionation=Use calcite to separate dense lead-bearing minerals directly from Vulcanus lava.
fw-vulcanus-bauxite-fractionation=Precipitate aluminum-rich bauxite from a calcite-treated lava stream.
fw-vulcanus-tin-fractionation=Separate tin-bearing minerals from a calcite-treated Vulcanus lava stream.
fw-vulcanus-silicon-fractionation=Separate silica-rich mineral stock from Vulcanus lava for local glass and electronics.
fw-vulcanus-titanium-fractionation=Use tungsten-rich seed ore to isolate scarce titanium minerals from a large lava charge.
fw-vulcanus-salt-fractionation=Precipitate industrial salts from the lighter mineral fraction of calcite-treated lava.
