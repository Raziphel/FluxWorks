[mod-setting-name]
fw-razi-seven-foundries=FluxWorks • Seven Foundries of Razi

[mod-setting-description]
fw-razi-seven-foundries=Optional Razi integration: unlock a distinct industrial field operation for each existing Razi star system using real local materials, obtain calibration records, and combine available records in the Atlas convergence process. Has no effect without Razi Protocol.

