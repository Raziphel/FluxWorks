fw-supercapacitor-conditioning=Condition a supercapacitor around reinforced power-control hardware for better endgame electrical throughput.
fw-fusion-power-cell-conditioning=Stabilize fusion power cells with late Flux thermal and rift-control hardware for stronger cell output.
