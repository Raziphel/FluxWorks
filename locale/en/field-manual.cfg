[fw-guide]
command-help=View the FluxWorks field manual. Use /fw-guide, /fw-guide status or /fw-guide atlas.
usage=Unknown option. Try /fw-guide, /fw-guide status or /fw-guide atlas.
title=FluxWorks | Industrial Field Manual
intro=FluxWorks is a standalone Space Age manufacturing expansion. Its four Works can be mastered without Razi Protocol or K2SO.
four=Yellow: chemical separation. Red: thermal fabrication. Green: cultivated materials. Purple: phase alignment. The Convergence Chassis joins all four.
next=Research the four Industrial Programs and build the Charter of the Four Works. Use /fw-guide status to see your progress.
razi=Razi detected: the Seven Foundries field commissions reward local industrial resources with calibration records. Use /fw-guide atlas for their purpose.
player-only=Research progress is only available from a player's force, not the server console.
progress=Industrial Programs researched: __1__/__2__
charter-complete=Charter of the Four Works: researched. Your four manufacturing standards are available.
charter-remaining=Charter of the Four Works: not yet researched. Complete all four Industrial Programs and Convergence engineering.
charter-inactive=Charter unavailable in this startup configuration. Check the program and charter settings.
foundries=Seven Foundries commissions researched: __1__/__2__ available systems
no-razi=The Seven Foundries Atlas is an optional Razi Protocol experience. Your independent Four Works Charter remains complete without it.
atlas=Each commissioned world can produce a physical calibration record. Reserve records for the two regional folios, reconcile surplus into manufacturing materials, and combine the folios at the Convergence Forge.
atlas-complete=Atlas research is complete. Compile your regional folios and manufacture the final convergence goods.
atlas-locked=Atlas technology is available but not yet researched. Finish the registered field commissions.
atlas-unavailable=Not enough compatible Razi field systems are present for an Atlas. Individual available commissions still work.
