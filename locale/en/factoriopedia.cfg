[fw-factoriopedia]
incomplete-rocket-part=An unfinished orbital frame segment recovered from FluxWorks-era launch architecture. It replaces direct rocket part crafting in balanced runs and must be finished with fuel in the silo.
incomplete-rocket-part-recipe=Builds the structural and control portion of a rocket part before fuel integration. This separates reusable hardware from consumable propellant.
fw-rocket-avionics-item=Recovered and requalified guidance electronics for rocket launch profiles and orbital targeting correction.
fw-rocket-avionics-recipe=Assembles a hardened avionics package from advanced processors, sensor blocks, and ribbon interconnects.
fw-rocket-heatshield-item=Composite thermal shield module intended for repeated atmospheric transit and refurbishment.
fw-rocket-heatshield-recipe=Builds a rocket heat shield from cermet, glass, and low-density structure framing.
rocket-chunk-item=Recovered orbital debris from a spent launch vehicle. Crush and refine these chunks to reclaim advanced components.
rocket-chunk-asteroid=Small debris fragments shed from used rockets in orbit. They can be collected and mined by platform systems.
used-rocket-asteroid=An intact spent-stage hull drifting through orbital lanes. Destroying it yields recoverable rocket chunks for industrial reprocessing.
rocket-chunk-processing-recipe=Crushes recovered rocket chunks into reusable high-tier components. This is FluxWorks' orbital salvage loop for reducing late-game launch waste.
rocket-chunk-processing-technology=Unlocks orbital remnant events and rocket chunk processing, enabling a closed-loop launch economy in space logistics chains.
remnant-beacon-item=A heavy orbital signal array tuned to remnant trajectories. Place it on station-keeping platforms to pull salvage opportunities toward your infrastructure.
remnant-beacon-entity=Powered remnant beacon that biases used-rocket spawns toward its platform. Best deployed on stable platforms with reliable power headroom.
remnant-beacon-recipe=Constructs a remnant beacon from advanced aerospace materials and control electronics.
remnant-beacon-technology=Teaches predictive remnant tracking and beacon guidance, allowing targeted recovery operations in orbit.
fw-crystalised-flux-item=A dense crystal node of condensed flux energy, harvested from rifts and refined into reactive fluid chains.
fw-crystalised-flux-resource=A geologically unstable flux rift that concentrates raw flux into mineable crystalline deposits.
fw-metallic-deposit-resource=Mixed metallic deposit that yields iron and copper with lead and tin traces. Ideal as an early broad-spectrum mining base.
fw-mineral-deposit-resource=Layered mineral deposit containing bauxite, silicon-rich material, and trace titanium for advanced metallurgy. Its icon and field profile now emphasize the bauxite-plus-silica mix more clearly in worldgen setup.
fw-carbonic-deposit-resource=Dark mixed seam producing coal, silicon-bearing material, and salt residues for chemistry and electronics supply.
fw-promethium-impact-resource=Rare meteoric impact fields where promethium-bearing fragments fused into exposed shard beds. Each tile contains only trace promethium, so these fields are for long, patient extraction rather than easy endgame jackpots.
fw-silica-vein-resource=Silicon-rich rock seam intended for wet biological terrain and sediment-heavy worlds. A natural fit for Gleba when you need direct silica supply instead of only mixed deposits.
fw-flux-quarry-item=Heavy-duty rift mining platform built to pin unstable Flux deposits in place long enough to harvest them safely.
fw-flux-quarry-recipe=Builds a Flux Quarry from reinforced structure, power hardware, and control systems rated for Rift extraction.
fw-flux-quarry-entity=Specialized quarry for Flux Rift fields. Place it directly over a rift to turn unstable crystal growth into a dependable industrial feed.
fw-purple-flux-fluid=Primary transmutation flux used across upcycle and downcycle chains. Recover and recycle it to keep conversion loops efficient.
fw-yellow-flux-fluid=Chemical spectrum Flux used for catalyst loops, polymer work, acid routing, and other recipes where unstable chemistry needs to be shoved into line.
fw-red-flux-fluid=Thermal spectrum Flux used for fuel densification, hot industrial material work, and the high-pressure power side of the Flux chain.
fw-green-flux-fluid=Regenerative spectrum Flux used for biomass recovery, nutrient rebuilding, seed propagation, and the living side of the factory.
fw-flux-resonance-cell-item=Spectrum-tuned containment cell that stores and channels stabilized Flux in multi-phase processing systems.
fw-flux-resonance-technology=Unlocks reusable catalyst loops and resonance processing, turning Flux into a high-tier production backbone.
fw-flux-phase-manifold-item=High-stability manifold assembly that coordinates multi-phase Flux flow for advanced synthesis routes.
fw-phase-anchor-item=Spatial anchor hardware that keeps late Flux utility machines stable while they compress or hold inventory beyond normal physical limits.
fw-entanglement-core-item=Late-stage control core for deep storage and other coherence-sensitive Flux utility systems.
fw-compression-baffle-item=Dedicated item-phase routing hardware that lets a vault compress one material stream without turning into a mixed junk buffer.
fw-phase-vault-item=Powered deep-storage vault patterned after a memory unit. It locks to one item type, keeps a large visible buffer ready, and packs the rest into an effectively infinite powered reserve.
fw-phase-vault-entity=Late-game item memory unit that stores one item type, exposes the count to circuits, and packs its contents into the mined item so the stored stack is preserved.
fw-phase-vault-recipe=Constructs a Phase Vault from logistic storage hardware, phase anchors, entanglement control, and superconductive late-game support parts.
fw-deep-phase-storage-technology=Turns phase engineering into true logistics infrastructure, unlocking the first FluxWorks machine that stores a factory-scale item reserve instead of merely processing materials.
fw-spectral-reservoir-item=Powered fluid memory unit that stores one fluid type, tints itself to match the held fluid, and preserves temperature when packed or unpacked.
fw-spectral-reservoir-entity=Late-game fluid memory tank with circuit output, temperature retention, and an effectively infinite powered reserve behind its visible front buffer.
fw-spectral-reservoir-recipe=Constructs a Spectral Reservoir from tank hardware, containment liners, cryogenic support parts, and late Flux control infrastructure.
fw-spectral-fluid-retention-technology=Pushes deep phase utility into fluid containment, unlocking a reservoir that preserves both large volume and retained temperature for demanding late factories.
fw-rift-coupler-item=Promethium-era transport coupler that bridges the storage branch into real cross-surface logistics hardware.
fw-rift-exchange-gate-item=Cross-surface logistics teleporter inspired by Telogistics. Set a destination and optional link ID, charge a full cycle, and exchange the gate inventory with a matched remote gate.
fw-rift-exchange-gate-entity=Large late-game teleporter that acts like a container until activated. It can be built on any surface and swaps inventories only with same-quality gates on another surface.
fw-rift-exchange-gate-recipe=Constructs a Rift Exchange Gate from rift couplers, phase anchors, entanglement control, and fusion-grade endgame infrastructure.
fw-rift-logistics-technology=Carries the late utility branch into real intersurface logistics by unlocking a powered rift-transfer gate for promethium-era factories and platforms.
fw-promethium-shard-item=Trace promethium contamination bound up in rocky shard matter. Individually weak, but worth refining when collected in bulk.
fw-promethium-primer-item=First real industrial promethium product. This conditioned feedstock bridges low-grade shard recovery and the heavier promethium hardware chain.
fw-promethium-primer-recipe=Blends multiple low-grade promethium shards with stabilized Flux hardware to make a manageable promethium feedstock for advanced fabrication.
fw-stabilized-flux-crystal-item=Cleaned and phase-locked Flux crystal stock suitable for real industrial use instead of raw rift handling.
fw-stabilized-flux-crystal-recipe=Stabilizes raw crystallised Flux into a safer intermediate for synthesis, lattice work, and promethium prep.
fw-flux-lattice-item=Structured crystal framework that gives later Flux components a stable geometry to build around.
fw-flux-lattice-recipe=Builds a repeatable lattice from stabilized crystals and advanced control materials, turning loose Flux into machine-grade structure.
fw-condensed-flux-matrix-item=Compact resonance matrix used as the dense heart of late Flux machines and cloning hardware.
fw-condensed-flux-matrix-recipe=Compresses stabilized Flux assemblies into a matrix core for condensers, resonance hardware, and advanced control systems.
fw-flux-catalyst-item=Starter catalyst for the first real Flux chemistry loop. It is the point where mined rift material becomes a reusable process medium.
fw-flux-synthesis-technology=Develops phase-manifold Flux synthesis for synthetic rift growth and strategic ore conversion.
fw-flux-condenser-item=FluxWorks cloning machine for complex products. Feed it one seed item and Purple Flux to produce one extra copy.
fw-flux-condenser-entity=Dedicated Flux cloning machine that uses normal recipes, machine inventories, and pipe connections instead of a separate custom interface.
fw-rocket-engine-item=FluxWorks-standard high-thrust engine module used in advanced platform and propulsion assemblies.
fw-transformer-core-item=High-density transformer core used wherever late-game factories need clean power routing, stable fields, or hardened platform infrastructure.
fw-comminution-technology=Establishes ore crushing as an early industrial backbone, unlocking improved yield routes and the first FluxWorks process chain branch.
fw-flux-extraction-technology=Authorizes deployment of Flux Quarries after reaching orbital launch capability, formalizing large-scale Flux Rift extraction.
fw-flux-mining-productivity-technology=Infinite late-game research that scales mining drill productivity, significantly increasing long-run Flux Rift output and overall extraction efficiency.
fw-material-foundations-technology=Builds the first integrated fabrication layer: glass, formed metals, insulation, and structural intermediates for expanded manufacturing.
fw-systems-integration-technology=Combines instrumentation, robotics, and power conversion into a unified high-tier machine architecture.
fw-harvester-systems-technology=Turns Flux from a mined oddity into a practical factory layer by unlocking the Harvester and the first serious beneficiation chains.
fw-flux-metallurgy-technology=Pushes red-spectrum Flux into heavy industry, opening the Arc Foundry and the hotter recast materials needed for late machines.
fw-harvester-head-item=Primary grading head for the Flux Harvester, built to keep transmutation, beneficiation, and downcycling stable inside one machine body.
fw-annealed-cermet-item=Red-flux tempered cermet stock reserved for hotter, harsher machine internals.
fw-resonance-substrate-item=Control substrate infused with stabilized Flux pathways for late-stage synthesis and resonance hardware.
fw-flux-harvester-item=Dedicated processing building for ore upcycling, downcycling, and heavy beneficiation work.
fw-arc-foundry-item=High-heat red-spectrum industrial furnace for advanced recasts and thermal reinforcement.
fw-synthesis-plant-item=Precision Flux integration machine for stabilized crystals, resonance parts, and promethium hardware.
fw-flux-harvester-entity=The main industrial machine for upgrading and downgrading material tiers once simple crushing stops being enough.
fw-arc-foundry-entity=Turns red Flux into practical heavy industry by annealing, recasting, and densifying durable process materials.
fw-synthesis-plant-entity=Where FluxWorks shifts from chemistry into tightly controlled synthesis of resonance, promethium, and endgame control assemblies.
fw-flux-harvester-recipe=Constructs a Flux Harvester from grading internals, pressure hardware, and mid-tier Flux machine parts.
fw-arc-foundry-recipe=Constructs an Arc Foundry from foundry liners, annealed cermet, smelter arrays, and regulated high-temperature hardware.
fw-synthesis-plant-recipe=Constructs a Synthesis Plant from stabilized Flux internals, precision routing parts, and dense control hardware.
fw-flux-condenser-recipe=Constructs a Flux Condenser from advanced Flux assemblies rather than raw base materials, keeping it in the late complex-manufacturing tier.
fw-resonance-assemblies-technology=Elevates Flux resonance from theory into real reusable hardware, especially the cells that tie multiple late-game systems together.
fw-flux-asteroid-harvesting-technology=Extends the Flux chain into orbit by refining Flux-tainted asteroid salvage into practical platform-side materials.
fw-flux-field-theory-technology=Formalizes field behavior at industrial scale, supporting the transition from strong Flux machines into genuinely strange endgame assemblies.

