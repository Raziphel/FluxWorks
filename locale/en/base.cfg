[technology-description]
fw-industrial-yield-1=Instrument mixed-deposit mines to recover more usable material from every extraction cycle.
fw-industrial-yield-2=Coordinate crushing feedback with drill control for a second step in global mining productivity.
fw-industrial-yield-3=Apply orbital-grade mineral models across the mining fleet for the program's largest yield increase.
fw-material-handling-1=Tune inserter timing and grip pressure to move larger batches through early industrial lines.
fw-material-handling-2=Synchronize bulk handling around production-scale buffers and higher sustained throughput.
fw-material-handling-3=Use space-grade scheduling to push inserter and bulk-inserter capacity to its final program tier.
fw-autonomous-logistics-1=Improve robot flight planning while increasing the useful payload of every logistics trip.
fw-autonomous-logistics-2=Coordinate charging, routing, and cargo allocation across large autonomous networks.
fw-autonomous-logistics-3=Deploy factory-wide traffic prediction for faster robots carrying another full payload increment.
fw-rail-network-control-1=Model train mass and braking curves to shorten safe stopping distances across the rail network.
fw-rail-network-control-2=Feed live signal telemetry into locomotive braking control for heavier, denser schedules.
fw-rail-network-control-3=Apply space-era network prediction to achieve the strongest braking response in the program.
fw-research-methodology-1=Standardize instrumentation and experimental design to make laboratories faster and less wasteful.
fw-research-methodology-2=Close the loop between production telemetry and laboratory work for more speed and productivity.
fw-research-methodology-3=Coordinate a space-scale research network that extracts substantially more progress from every pack.
fw-flux-process-mastery-1=Refine catalyst and stabilized-crystal production through tighter control of early Flux reactions.
fw-flux-process-mastery-2=Recover more value from metallic synthesis and orbital Flux-asteroid refinement.
fw-flux-process-mastery-3=Master resonance and phase assembly to improve the yield of the most demanding Flux components.
fw-industrial-methods-science=Formalizes fabrication and material-processing knowledge into a science pack used throughout the mature industrial tree.
fw-systems-analysis-science=Turns sensors, signals, and control hardware into a dedicated science discipline for advanced networked machinery.
fw-flux-theory-science=Converts stabilized Flux behavior into a required research discipline for advanced field, phase, thermal, and synthesis technologies.
fw-planetary-convergence-science=Unifies the four planetary industries with promethium and every Flux spectrum, becoming the research language of the Shattered Planet and origin projects.
fw-industrial-district-project=Complete an expensive industrial charter shipment to earn permanent mining and material-handling improvements.
fw-autonomous-network-project=Commission a full autonomous network to permanently improve robot speed and carrying capacity.
fw-spectrum-control-project=Formalize mature Flux production into permanent productivity gains for critical Flux intermediates.
fw-convergence-directive-project=Complete the ultimate planetary-industrial project for permanent gains to research, mining, and autonomous logistics.
fw-shattered-expedition-planning=Unlocks the Shattered Planet and permanently grants +10% space-platform foundation productivity.
fw-shattered-platform-hardening=Hardens platform construction methods and permanently adds another +15% space-platform foundation productivity.
fw-shattered-landing-protocols=Turns the first landing into a permanent construction advantage by granting +20% productivity to the one canonical foundation recipe.
fw-shattered-vulcanus-bridgehead=Unlocks a seed-free slag-cermet forging route and grants +20% slag-cermet productivity.
fw-shattered-gleba-bridgehead=Unlocks a seed-free spore-resin cultivation route and grants +20% spore-resin productivity.
fw-shattered-fulgora-bridgehead=Unlocks a seed-free static-mesh reclamation route and grants +20% static-mesh productivity.
fw-shattered-aquilo-bridgehead=Unlocks a seed-free cryogel annealing route and grants +20% cryogel productivity.
fw-shattered-vent-harmonics=Unlocks four-spectrum matrix synthesis and grants +20% condensed-matrix productivity.
fw-ion-storm-survival=Applies storm-field engineering to the one canonical foundation recipe, granting another +30% foundation productivity without adding a duplicate recipe or hidden immunity mechanic.
fw-shattered-network-logistics=Unlocks model lattices and a direct rift-coupler assembly route, plus +25% rift-coupler productivity.
fw-shattered-origin-survey=Unlocks harmonic cores and a direct model-lattice survey route, plus +25% model-lattice productivity.
fw-ion-storm-capture=Unlocks direct storm-forging of harmonic cores and grants +25% harmonic-core productivity, opening the storm-megastructure branch.
fw-orbital-flux-industrialization=Intertwines the first space-platform industry with FluxWorks control hardware, making asteroid processing part of the overhaul instead of a parallel vanilla branch.
fw-vulcanus-industrial-symbiosis=Merges Vulcanus foundry practice with Red Flux energetics and FluxWorks structural materials, opening carbide sintering and denser molten casting.
fw-gleba-regenerative-symbiosis=Merges Gleba cultivation with Green Flux recovery so carbon fiber and biological factory growth become one regenerative industrial branch.
fw-fulgora-electromagnetic-symbiosis=Merges Fulgoran recycling and electromagnetic machinery with Yellow Flux separation control for deliberate holmium recovery.
fw-aquilo-thermal-symbiosis=Merges Aquilo cryogenics with Red Flux thermal control, turning frozen chemistry into a controlled energetic production discipline.
fw-cross-planetary-industrial-convergence=Requires all four planetary symbiosis branches and Flux convergence, then combines their reward materials into an overhaul-grade quantum manufacturing route.
fw-flux-purple-transmutation=Defines Purple Flux as the material and phase lane: deconstruct finished matter into spectrum mass, then spend it to move ores up the transmutation ladder or downcycle shortages with a partial refund.
fw-liquid-mining=Bridges early processing into the first serious fluid work, unlocking mining-with-fluid plus the chlorine and carbon-washing routes that prepare the factory for its first real Flux handling.
fw-comminution=Unlocks crusher operation and the first rough-crushing chain for iron and copper recovery so the factory can start doing more than raw smelting.
fw-aggregate-recovery=Turns early crushing debris into usable sand so the opening minutes already pivot toward glass, filters, and proper processed materials.
fw-basic-separation=Introduces the first simple sorting and recovery work, focusing the opening branch on refined carbon instead of dumping every side product into one lump unlock.
fw-brine-processing=Adds a dedicated salt-and-brine step so the chemical side of the early game starts with a visible utility chain instead of appearing out of nowhere later.
fw-ore-crushing=Extends the crusher program into heavier ore bodies, opening crushed lead and titanium recovery before the furnace lines are ready to capitalize on them.
fw-dense-ore-smelting=Closes the loop on heavy crushed ores by teaching the factory how to smelt those denser concentrates into real metal output.
fw-mineral-beneficiation=Pushes early separation into more demanding silicon-grade ore treatment so mixed mineral patches keep paying off after the first bootstrap.
fw-glassworking=Turns all that early sand into practical industrial glass, giving the first processing branch a real reward instead of just extra dust.
fw-elastomer-processing=Turns the salt branch into the first real soft-material step, giving the opening factory a distinct rubber-and-seals identity much earlier.
fw-material-foundations=Turns the first structural branch toward metal mesh so machine recipes stop jumping straight from plates to fully finished parts.
fw-structural-fabrication=Pushes basic materials into practical iron structure parts for the first real machine bodies instead of bundling every fabricated shape together.
fw-contact-casting=Introduces dedicated contact-forming work so early circuit parts stop hiding inside broader material unlocks.
fw-tube-forming=Packages early structure, rubber, and carbon work into tubes and inline filter bodies that make later chemistry and machine recipes feel engineered instead of improvised.
fw-metals-fabrication=Expands early metalworking into solder alloys and bronze stock, making the alloy branch visible before it turns into full precision hardware.
fw-precision-alloys=Turns alloy work into practical bearings and ceramic insulators that support the first serious machines and controlled assemblies.
fw-beam-engineering=Focuses the structural branch on stronger beam work for midgame frames and reinforced fabrication.
fw-conductive-assembly=Builds a real cable-prep layer with tinned conductors before the branch graduates into harnesses and multi-line routing.
fw-cable-looming=Turns prepared conductors into proper harness stock so the early electrical branch looks assembled instead of improvised from loose cable.
fw-chip-packaging=Separates chip carriers from raw wafers so the opening electronics climb feels more deliberate and less like two whole stages appearing at once.
fw-electromechanical-systems=Introduces advanced electrical subcomponents like substrates, coils, and refined silicon for the first serious machine-control layer.
fw-capacitive-systems=Breaks energy storage hardware into its own step so capacitors feel earned as electrical control parts instead of spare outputs from a bigger unlock bundle.
fw-material-refinement=Develops refined composite and filter materials for high-purity industrial throughput.
fw-instrumentation=Unlocks precision optical work with dedicated lenses before the branch escalates into full sensor packages and control assemblies.
fw-ribbon-conductors=Turns the maturing conductor branch toward dense flat routing for control cabinets, instrument clusters, and compact electronics.
fw-systems-integration=Integrates sensors and transformer cores into robust networked machine and platform systems.
fw-sensor-integration=Packages precision sensing into a dedicated systems milestone so late control hardware arrives in a more deliberate sequence.
fw-advanced-fabrication=Unlocks high-end composite construction, lightweight frames, and upgraded propellant compounds.
fw-lightweight-framing=Turns advanced fabrication toward lightweight structural frames used in robotics, aerospace, and heavier industrial assemblies.
fw-propellant-synthesis=Breaks ballistic propellants into their own late fabrication lane instead of treating them like a side effect of structural upgrades.
fw-circuit-foundry=Turns the electronics branch into a real manufacturing lane with contacts, solder work, and rugged wafer prep.
fw-wafer-etching=Separates silicon wafer work from later chip packaging so the jump into electronics is wider and more readable in the early factory.
fw-signal-architecture=Builds dependable signal paths with bundled conductors and tighter routing discipline before full control logic comes online.
fw-microelectronics=Turns packaged carriers and bundled conductors into true control chips, giving the blue-science transition a much clearer FluxWorks electronics step.
fw-computational-arrays=Scales the electronics line into proper computational hardware with packaged memory and compact turbine assemblies instead of loose parts.
fw-industrial-expansion=Unlocks advanced FluxWorks processing routes, synthetic component loops, and late-midgame industrial upgrades.
fw-arc-recasting=Turns industrial expansion toward high-heat recasting, using refined arc work to convert graded materials into cermets and optical glass instead of leaving those outputs buried in a broader utility unlock.
fw-reactive-powders=Focuses industrial chemistry on dense synthetic propellants so explosive compounds become a deliberate military-industrial milestone rather than a side note of the foundry branch.
fw-slurry-beneficiation=Pushes industrial expansion into ore grading and slurry cleanup, giving advanced feedstock upgrading its own resource-efficiency branch.
fw-pressure-containment=Turns early sealed fluidwork into a pressure-rated pipe and pumping branch without bundling bulk storage into the same research.
fw-pressure-reservoirs=Extends pressure-rated pipework into the first purpose-built bulk fluid reservoir.
fw-bulk-logistics=Introduces the first reinforced loader as a dedicated belt-transfer milestone.
fw-fast-loader-handling=Upgrades reinforced loader handling to fast-belt throughput as its own visible logistics step.
fw-bulk-storage=Builds reinforced strongboxes and warehouses as a storage branch separate from belt loading.
fw-network-logistics=Extends dedicated loader hardware to express-belt throughput after fast handling and signal architecture are established.
fw-network-storage=Adds passive-provider and storage-network variants to the established strongbox and warehouse family.
fw-logistics-orchestration=Completes the loader ladder with an advanced unit designed for turbo-belt factory districts.
fw-controlled-storage=Completes warehouse networking with active-provider, buffer, and requester variants after the logistic system matures.
fw-high-capacity-fluid-storage=Turns the pressure-reservoir branch into a huge late-factory tank without hiding it inside loader research.
fw-petrochemical-engineering=Formalize heavier chemical plantwork around binders and refinery-adjacent process hardware, giving FluxWorks polymers a real industrial backbone.
fw-reactive-binders=Split petrochem into a real intermediate layer by conditioning chlorine, resin, and sulfur into binder stock that later sealing work actually depends on.
fw-elastomer-engineering=Turn raw binder chemistry into pressure-tolerant elastomer stock so seals and hydraulic assemblies grow from a dedicated material branch instead of skipping straight to finished parts.
fw-polymer-stabilization=Push petrochemical work beyond a single glue recipe into stabilized elastomer stock that supports broader machine and seal families.
fw-hydraulic-systems=Build pressure-rated machinery and sealing hardware for fluid-heavy industrial equipment, opening the hydraulic layer that supports tougher process plants.
fw-fluid-control-architecture=Turn hydraulic hardware into a true control branch with actuators, servo valves, and manifold logic for late fluid systems.
fw-isotope-conditioning=Apply controlled atomic processing to produce denser isotopic stock for advanced reactor and power-system construction.
fw-fuel-fabrication=Establishes the atom-forge as a real production lane, splitting shielded casings, pellet bundles, and the enrichment machine into a dedicated reactor-fuel milestone.
fw-lattice-moderation=Turns isotope conditioning into reactor-core architecture, separating moderator lattices and isotope matrices into their own stability-focused branch.
fw-reactor-doping=Push isotopic engineering into true reactor-grade additives that support fusion-era and promethium-era hardware.
fw-reactor-safeguards=Builds the protective control layer around advanced reactors with coolant cartridges and rod assemblies before the branch escalates into full actinide recycling.
fw-actinide-recovery=Turn spent reactor material into a recoverable process stream, giving the atomic branch a real recycling backbone instead of a dead-end fuel sink.
fw-actinide-sorting=Breaks recovered reactor waste into a dedicated sorting and isotope-analysis stage so actinide salvage feels like an actual process lane.
fw-actinide-reforging=Turns recovered actinides back into lattices, seeded matrices, and refurbished pellet stock, giving the late atomic branch a true remanufacturing identity.
fw-reactor-instrumentation=Build the reactor-control and monitoring layer that ties the atomic branch back into the wider late nuclear stack without relying on a separate specialist module family.
fw-flux-extraction=Midgame extraction program that adapts sealed mining and fluid-control hardware into Flux Quarry deployments for the first industrial harvests of shattered Flux source fragments.
fw-flux-mining-productivity=Infinite research that improves mining drill productivity for Flux Rift extraction and all other drill-based resource harvesting.
rocket-chunk-processing=Enables used rocket remnants to drift through orbit. Recovered chunks can be reprocessed into rocket components, excluding fuel.
remnant-beacon=Remnant beacons attract used rocket remnants when placed on a platform. Powered beacons make those platforms a priority for remnant spawns.
fw-flux-catalysis=Starts the Flux program by turning harvested Rift fragments into reusable catalysts and the first disciplined factory-floor forms of Shattered Flux.
fw-flux-stabilization=Turns mined Flux from a volatile additive into stable crystal stock and containment hardware so the rest of the branch can run continuously.
fw-flux-yellow-catalysis=Defines Yellow Flux as the shaping and process-control lane, focused on pressure chemistry, chlorine handling, and the first precise routing work.
fw-harvester-systems=Builds the purple recovery lane around practical ore grading, shortage recovery, and partial Flux reclamation instead of treating the Harvester like a side gimmick.
fw-flux-structuring=Turns the Yellow lane into solid hardware, building lattices and substrates that support the first real spectrum-tuned assemblies.
fw-flux-red-energetics=Defines Red Flux as the heat and power lane, pushing combustion density, fuel handling, and high-energy industrial work into a distinct specialization.
fw-flux-green-reclamation=Defines Green Flux as the recovery lane, using it to salvage spoilage, stretch nutrient chains, and reclaim value from unstable biological waste.
fw-flux-metallurgy=Turns the Red lane into heavy foundry and annealing hardware so high-heat processing becomes a proper Flux payoff instead of a generic late branch.
fw-flux-resonance=Brings the Yellow, Red, Green, and purple recovery work back together into the first disciplined multi-spectrum core built around matrices and resonance substrates.
fw-resonance-assemblies=Turns resonance theory into stable multi-spectrum parts, creating the first Flux hardware that feels unified instead of branch-specific.
fw-flux-asteroid-harvesting=Extends the resonance platform into orbital salvage, using tuned Flux hardware to recover and sort asteroid remnants without relying on generic space handling.
fw-flux-field-theory=Formalizes how the branch colors interact after resonance and orbital salvage, setting the logical foundation for planetary specialization, deeper transmutation, and late utility work.
fw-aquilo-cryochemistry=Turns Yellow Flux chemistry toward Aquilo with conditioned electrolyte, improved lithium recovery, and fluoroketone process control.
fw-gleba-biochemistry=Turns Gleba biomass into a proper late-game chemistry reward by culturing spore resin that feeds high-end Flux hardware.
fw-flux-chemical-synthesis=Pushes the Yellow lane from control chemistry into full industrial synthesis, turning structured Flux into binders, elastomers, and conditioned fluids that feed the late factory.
fw-vulcanus-pyrochemistry=Pushes Flux chemistry into Vulcanus-grade heat and slag conditioning so the foundry branch earns a real planetary endgame reward.
fw-flux-reactive-slurries=Crosses the Yellow and Red lanes into demolition gels, battery chemistry, and the most unstable industrial slurries in the whole branch.
fw-fulgora-electrochemistry=Bridges Fulgora field hardware and electrochemistry into a charged conductor stock meant for serious electromagnetic infrastructure.
fw-flux-green-cultivation=Turns the Green lane from basic reclamation into deliberate cultivation, building bioflux growth, aquaculture, and self-sustaining biological production on top of salvaged systems.
fw-flux-green-propagation=Pushes the Green lane into regenerative duplication and seedbank control so biological supply chains can scale instead of only recovering losses.
fw-flux-thermal-networks=Turns the Red lane from raw energetic output into full thermal infrastructure with high-power heat routing, cryogenic damping, and rocket-fuel-grade industrial buffering.
fw-superconductive-systems=Bridges Aquilo cryochemistry and electromagnetic control into superconductors and supercapacitors that feel like proper late planetary hardware.
fw-flux-phase-engineering=Builds on resonance, superconductive control, and field theory to create manifold-scale multi-phase architecture for the first true Flux utility machines.
fw-deep-phase-storage=Turns phase-engineering into practical deep-storage infrastructure, unlocking the first FluxWorks utility machines built around anchors, entanglement control, and compression hardware.
fw-spectral-fluid-retention=Extends deep phase utility work into temperature-aware fluid retention, marrying thermal containment with phase-stable fluid memory instead of treating fluids like a separate branch.
fw-rift-logistics=Turns the mature utility branch into true cross-surface logistics, unlocking couplers and paired transfer gates that merge the item and fluid storage lines into promethium-era transport.
fw-flux-overdrive=Turns the late Red lane into promethium-conditioned overdrive hardware capable of staging the heaviest fuel, heat, and power systems in the branch.
fw-fusion-lattices=Carries Flux hardware into fusion-era containment, stabilizing conditioned power-cell work with promethium-safe lattice control.
fw-flux-synthesis=Turns resonance, phase work, and chemical conditioning into condenser access and true late Flux manufacturing, where the branch becomes a full production platform.
fw-flux-convergence=Final late-game reunification of the color lanes, planetary reward materials, and promethium conditioning into one coherent endgame Flux platform, finally revealing the Shattered Planet as the origin point of the whole branch.
fw-rift-harmonics=Final promethium-era harmonic control that enables synthetic rift crystal growth without collapsing the larger converged Flux network.
fw-origin-infrastructure=Turns the Shattered finale from a couple of clever storm recipes into real origin-grade industry, unlocking the forge and the first parts of true storm infrastructure.
fw-storm-megastructures=Escalates the Shattered branch into full megaproject territory, where mature vent networks stop producing just science and start producing the giant hardware meant to carry the game home.
fw-origin-transcendence=Pushes the branch into openly stupid territory: billion-scale flux forging, trillion-scale cumulative spend, and a final singularity monument that must be awakened on the Shattered Planet itself to close the game.
fw-reactive-chemistry-productivity=Unlocks controlled demolition and incendiary chemistry passes built around denser slurry and napalm handling.
fw-green-reclamation-productivity=Unlocks a spoilage-heavy compost bloom that recovers bioflux instead of stopping at basic nutrient salvage.
fw-green-cultivation-productivity=Unlocks dedicated Green Flux bloom routes for biolubricant and aquaculture production.
fw-green-propagation-productivity=Unlocks managed seedbank routes for the regenerative side of the Green Flux chain.
fw-cryogenic-loop-productivity=Unlocks closed-loop coolant recovery and improved cryogel finishing for Aquilo-grade chemistry.
fw-phase-assembly-productivity=Unlocks calibrated resonance-cell and manifold assembly passes that recover catalysts more reliably.
fw-asteroid-refinement-productivity=Unlocks a deeper asteroid sorting pass focused on cleaner matrix, crystal, and catalyst recovery.
fw-ceramic-engineering=Extends early FluxWorks structure parts into ceramic shells and durable machine casings.
fw-machine-casings=Turns fired ceramics into proper machine shells so structure parts graduate into recognizable equipment bodies before the late game.
fw-conductive-networks=Builds denser coil hardware so midgame electrical recipes can feel like real assemblies instead of just upgraded cable bundles.
fw-signal-routing=Turns the network branch toward actual routed conduit stock for machine interconnects and later Flux control hardware.
fw-optical-instrumentation=Pushes optics beyond a single lens into proper array hardware for advanced sensing and control.
fw-sealed-systems=Introduces sealed housings for machines that should actually look process-ready before they also learn dynamic fluid control.
fw-fluid-regulation=Turns sealed housings into active flow-control hardware so regulators feel like their own engineering step instead of a free extra.
fw-polymer-chemistry=Turns the first liquid-mining chemistry into a real polymer branch with resin, sulfur, acid, and vulcanized material loops.
fw-power-regulation=Turns the transformer branch into a broader power-control layer for utility and late factory infrastructure.
fw-field-balancing=Extends power-control hardware into tuned field windings for denser regulators, reactor instruments, and later Flux resonance equipment.
fw-energetic-compounds=Builds a distinct munitions-and-electrolyte branch so demolition gels, battery chemistry, and napalm arrive as a coherent military-industrial step.
fw-metallurgic-assemblies=Adds dedicated metallurgic subassemblies instead of treating foundries like just bigger furnaces.
fw-cryogenic-control=Builds a real cryogenic hardware layer with specialized coils and thermal damping, tied directly into Aquilo-grade machinery.
fw-thermal-retention=Extends cryogenic hardware into full thermal smoothing assemblies for systems that need to survive violent hot-cold cycling.
fw-electromagnetic-architecture=Packages sensing, routing, and dense field control into a proper electromagnetic late-game branch anchored to Fulgora machinery.
fw-logic-weaving=Turns electromagnetic control hardware into dense machine logic, making the matrix layer a proper destination instead of a bundled bonus.
fw-orbital-hardening=Prepares reusable orbital hardware with dedicated avionics and heatshield assemblies before remnant salvage and heavier platform work.
fw-promethium-stabilization=Builds the first promethium-safe Flux hardware and primer chemistry, turning scattered shards into a controlled bridge between the converged branch and its final endgame systems.

