[string-mod-setting]
fw-difficulty-mode-easy=Easy
fw-difficulty-mode-normal=Normal
fw-difficulty-mode-hard=Hard

[mod-setting-description]
fw-difficulty-mode=Easy: Strongly reduces FluxWorks recipe pressure, cuts many midgame and lategame ingredient counts much more aggressively, and noticeably shortens harder crafting chains.\nNormal: Uses the standard FluxWorks recipe balance. [color=red]RECOMMENDED[/color]\nHard: Strongly increases FluxWorks ingredient demands across many crafted items, with especially heavy pressure on synthesis, condensing, orbital, science, and late-machine work.
fw-enable-recipe-integration=Yes: FluxWorks components are threaded through vanilla and Space Age recipes where they fit the item family. [color=red]RECOMMENDED[/color]\nNo: FluxWorks keeps its own recipe chains, but the broad vanilla and Space Age integration pass is skipped.
fw-enable-crafting-tab-reorganization=Yes: FluxWorks reorganizes many vanilla, Space Age, and modded recipes into the custom FluxWorks crafting tabs. [color=red]RECOMMENDED[/color]\nNo: Recipes stay closer to their default crafting groups, while FluxWorks-only tabs and items still exist.
fw-difficulty-affects-fluid-systems=Yes: Difficulty mode also adjusts pumps, pipes, refineries, thermal hardware, and other fluid-system recipes that use FluxWorks parts. [color=red]RECOMMENDED[/color]\nNo: Difficulty mode leaves those fluid and thermal recipe families at their normal ingredient balance.
fw-difficulty-affects-control-systems=Yes: Difficulty mode also adjusts combinators, poles, radar, signals, and other control-network recipes that use FluxWorks electronics parts. [color=red]RECOMMENDED[/color]\nNo: Difficulty mode leaves those control and signal recipe families at their normal ingredient balance.
fw-difficulty-affects-late-machines=Yes: Difficulty mode also adjusts advanced machines, reactors, armor, and other late-game hardware that pick up FluxWorks machine parts. [color=red]RECOMMENDED[/color]\nNo: Difficulty mode leaves those late-game machine and hardware recipe families at their normal ingredient balance.
fw-difficulty-affects-orbital-recipes=Yes: Difficulty mode also adjusts rocket, platform, orbital, and cargo-launch recipes that use FluxWorks aerospace parts. [color=red]RECOMMENDED[/color]\nNo: Difficulty mode leaves those orbital and launch recipe families at their normal ingredient balance.
fw-enable-science-pack-overhaul=Yes: FluxWorks rebuilds the science packs with more deliberate machine, material, and planetary part choices instead of broad ingredient stuffing. [color=red]RECOMMENDED[/color]\nNo: Science packs keep the broader integrated recipe changes, but the dedicated FluxWorks science-pack cleanup and retuning pass is skipped.
fw-enable-core-material-replacements=Yes: Several recipe families replace raw vanilla parts like pipes, gears, steel, and batteries with FluxWorks fabricated components where that makes sense. [color=red]RECOMMENDED[/color]\nNo: Those recipes keep their more vanilla-style base ingredients instead of being rebuilt around FluxWorks replacement parts.
fw-enable-combat-recipe-integration=Yes: Ammo, turrets, capsules, explosives, and related combat recipes pick up FluxWorks ballistic, sensing, and defensive materials where they fit. [color=red]RECOMMENDED[/color]\nNo: The dedicated combat-facing FluxWorks recipe additions are skipped, keeping the military branch closer to default ingredients.
fw-enable-orbital-and-planetary-integration=Yes: Orbital hardware and Space Age planetary machines, science, and late structures pick up FluxWorks aerospace and planetary materials. [color=red]RECOMMENDED[/color]\nNo: The deeper orbital and planetary FluxWorks integration pass is skipped, keeping those recipes closer to base Space Age structure.
fw-enable-machine-part-rehoming=Yes: Late FluxWorks parts are pushed into the synthesis and condensing machine lanes, with extra dependencies that make those machines own the endgame chain. [color=red]RECOMMENDED[/color]\nNo: Those late FluxWorks parts keep their earlier recipe routing and avoid the dedicated machine-lane rehoming pass.
enable-incomplete-rocket-parts=Yes: Rockets are built through incomplete rocket parts, making the launch chain more staged and better balanced. [color=red]RECOMMENDED[/color]\nNo: Rockets use the simpler vanilla-style construction path, which is easier but much more exploitable.
enable-incomplete-rocket-parts-productivity=Yes: Productivity modules can affect incomplete rocket parts, making rocket-part production much stronger.\nNo: Productivity modules do not affect incomplete rocket parts, keeping the rocket loop more controlled. [color=red]RECOMMENDED[/color]
fw-difficulty-affects-science-recipes=Yes: Difficulty mode also scales the science pack recipes themselves, keeping research progression aligned with the selected challenge level. [color=red]RECOMMENDED[/color]\nNo: Difficulty mode leaves science pack recipes at their normal ingredient balance, even while other affected recipe families still scale.
fw-difficulty-affects-flux-core-recipes=Yes: Difficulty mode also scales FluxWorks-native recipes like harvesting, synthesis, condensing, and the core Flux production ladder. [color=red]RECOMMENDED[/color]\nNo: Difficulty mode mostly focuses on integrated external recipes, while the core FluxWorks recipe ladder stays closer to normal balance.
fw-difficulty-affects-crafting-time=Yes: Difficulty mode also changes crafting times on affected recipes, not just ingredient amounts. [color=red]RECOMMENDED[/color]\nNo: Difficulty mode only changes ingredient amounts, while crafting times stay at their normal values.
fw-tab-science-organization=Yes: Science packs and labs move into the dedicated FluxWorks science tab for a cleaner research-focused view. [color=red]RECOMMENDED[/color]\nNo: Science packs and labs stay in their more default crafting groups instead of being pulled into the custom science tab.
fw-tab-bioprocessing-organization=Yes: Biological items, machines, and recipes are gathered into the FluxWorks bioprocessing tabs. [color=red]RECOMMENDED[/color]\nNo: Biological items and recipes stay closer to their default groups instead of being heavily reorganized.
fw-tab-chemistry-organization=Yes: Chemistry materials, fluids, machines, and processing recipes are gathered into the FluxWorks chemistry tabs. [color=red]RECOMMENDED[/color]\nNo: Chemistry-related content stays closer to vanilla and Space Age crafting groups instead of being fully regrouped.
fw-tab-flux-organization=Yes: Flux fluids, machines, conditioning recipes, exchange routes, and endgame Flux systems are gathered into the Flux tabs. [color=red]RECOMMENDED[/color]\nNo: Flux-specific recipes keep more of their original subgroup placement instead of being fully sorted into color and system lanes.
fw-tab-fabrication-organization=Yes: Fabrication buildings like the Arc Foundry and Synthesis Plant move into the dedicated fabrication tab. [color=red]RECOMMENDED[/color]\nNo: Fabrication machines stay closer to their default groups instead of being forced into the custom fabrication tab.
fw-memory-unit-power-usage=A multiplier for how much extra power the Phase Vault and Spectral Reservoir drain as stored volume rises. Formula: [font=default-small]1MW + (ceil(stored amount / divisor) ^ 0.35) * multiplier[/font]

