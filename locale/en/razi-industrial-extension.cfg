[recipe-description]
fw-industry-reactor-lining-recovery=Refire recovered structural metal, carbon and resin into foundry lining with a sustained Fuel Flux heat cycle.
fw-industry-resonant-mesh-fabrication=Fuse conductors and circuit substrates with two Flux spectra for a precision mesh production run.
fw-industry-precision-seal-molding=Reprocess polymers and filter assemblies into reinforced industrial seals.
fw-industry-living-filtration=Culture engineered filter membranes from renewable resin and nutrient beds.
fw-industry-chromatic-cermet-recasting=Recast high-temperature cermet using paired Fuel and Chemical Flux and fresh metal input.
fw-industry-regenerative-substrate-weaving=Rebuild resonance substrates from sensors, cultivated resin and finished lattices.
fw-industry-thermal-buffer-lamination=Lamination of cryogel, ceramics and annealed cermet for thermal control equipment.
fw-industry-sensor-membrane-reclamation=Recover sensor assemblies using precise Chemical Flux and Biological Flux membrane processing.
