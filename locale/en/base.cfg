[item-description]
fw-lead-pipe=Lead-network pipe. Connects to lead pipes and ordinary fluid machines, but not directly to copper pipes.
fw-lead-pipe-to-ground=Underground lead-network pipe. Connects to lead pipes and ordinary fluid machines, but not directly to copper pipes.
fw-lead-pump=Lead-network pump. Connects to lead pipes and ordinary fluid machines, but not directly to copper pipes.
fw-copper-pipe=Copper-network pipe. Connects to copper pipes and ordinary fluid machines, but not directly to lead pipes.
fw-copper-pipe-to-ground=Underground copper-network pipe. Connects to copper pipes and ordinary fluid machines, but not directly to lead pipes.
fw-copper-pump=Copper-network pump. Connects to copper pipes and ordinary fluid machines, but not directly to lead pipes.
fw-lead-bacteria=A violet Gleba culture that concentrates lead-bearing minerals and naturally occurs in iron stromatolites. Cultivate it before it spoils into lead ore.
fw-bauxite-bacteria=An orange Gleba culture that precipitates aluminum-rich bauxite and naturally occurs in copper stromatolites.
fw-tin-bacteria=A pale metallic Gleba culture that accumulates tin and naturally occurs in copper stromatolites.
fw-silicon-bacteria=A cyan Gleba culture that strips silica from mineral matter and naturally occurs in iron stromatolites.
fw-titanium-bacteria=A blue Gleba culture that slowly concentrates scarce titanium and naturally occurs in iron stromatolites.
fw-salt-bacteria=A white Gleba culture that biomineralizes dissolved salts and naturally occurs in copper stromatolites.
fw-industrial-methods-science-pack=Encodes repeatable knowledge about fabrication, mixed-material processing, and industrial-scale construction.
fw-systems-analysis-science-pack=Combines sensing, signal routing, and control telemetry into a researchable systems model.
fw-flux-theory-science-pack=Captures stabilized Flux behavior as reproducible resonance and phase-control data.
fw-planetary-convergence-science-pack=Science pack for Shattered Planet and Origin Project research.
fw-crystalised-flux=A dense crystal threaded with unstable Flux energy. These rift crystals are fractured source material from the Shattered Planet, and even small amounts let ordinary industry touch the broken building stock of matter itself.
fw-crushed-lead-ore=Crushed lead ore with improved smelting yield.
fw-crushed-titanium-ore=Crushed titanium ore with improved smelting yield.
fw-crushed-iron-ore=Magnetite-rich iron fragments prepared for faster, productivity-compatible smelting.
fw-crushed-copper-ore=Concentrated copper fragments prepared for faster, productivity-compatible smelting.
fw-crushed-tin-ore=Graded cassiterite fragments prepared for dense tin smelting.
fw-crushed-bauxite-ore=Broken and graded bauxite prepared for alumina recovery.
fw-alumina-refractory=Calcined alumina-rich refractory stock made from bauxite, sand, and salt for ceramics, insulators, and foundry heat shielding.
fw-iron-beam=Structural iron beam used in basic inserter mechanisms.
fw-steel-beam=Reinforced beam for higher-speed and filtered inserter assemblies.
fw-aluminum-beam=Lightweight high-strength beam for top-tier inserter frames.
fw-inductor-coil=Wound conductive coil for advanced electronic and power devices.
fw-circuit-substrate=Layered substrate foundation for robust circuit manufacturing.
fw-metal-mesh=Woven metal reinforcement mesh for composite and industrial parts.
fw-rubber-sheet=Vulcanized insulating sheet used for cable and composite fabrication.
fw-composite-panel=Multilayer industrial panel combining mesh, polymer, and glass.
fw-ribbon-cable=Flat multi-conductor cable used in dense control electronics.
fw-sensor-package=Integrated sensing unit for precision modules and control systems.
fw-cermet=Hybrid ceramic-metal composite for heat-resistant industrial components.
fw-resin=Polymerized chemical resin used in high-reactivity binders, gels, and industrial composite chemistry.
fw-aquilo-cryogel=Cryogenic gel pack stabilized with Aquilo chemistry and Flux conditioning for extreme low-temperature systems.
fw-gleba-spore-resin=Bioreactive resin grown from Gleba biomass and tuned for living industrial process loops.
fw-nutrient-bed=Prepared growth substrate bed that carries Flux-fed nutrients and biofilter structure into Gleba cultivation hardware.
fw-fulgora-static-mesh=Charged conductive mesh woven around Fulgora-grade electrochemical hardware for dense field handling.
fw-vulcanus-slag-cermet=Slag-tempered cermet stock reinforced with Vulcanus heat chemistry for brutal endgame thermal loads.
fw-inline-filter=Replaceable inline filter element for fluid and chemical systems.
fw-transformer-core=Power conversion core used in high-load electrical infrastructure.
fw-solder-alloy=A workable solder alloy used throughout advanced electronics.
fw-bearing=Precision-machined bearing for engines and moving machinery.
fw-light-frame=A lightweight reinforced frame for robotics and aerospace structures.
fw-ceramic-insulator=Glazed ceramic insulator for reliable early electrical equipment.
fw-capacitor=A compact charge-storage component for advanced circuits and power systems.
fw-gunpowder=A stabilized ballistic propellant used in ammunition production.
fw-solder-wire=Soft solder-wrapped wire used to bridge early circuit parts into reliable assemblies.
fw-chip-carrier=Prepared carrier board that holds etched wafers, contacts, and routing points in one stable package.
fw-microchip=Microchip used in advanced automation and control builds.
fw-memory-die=Packaged memory element used in denser control systems, platform hardware, and late machine logic.
fw-circuit-contact=Stamped conductive contact for FluxWorks electronics.
fw-rocket-engine=High-performance engine assembly for late-game propulsion systems.
fw-flux-quarry=Heavy extraction platform tuned to harvest crystalline Flux directly from Rift fragments before you can reach the Shattered Planet itself.
fw-tinned-cable=Pre-tinned multi-strand cable for low-loss signal and power routing.
fw-silicon-wafer=Processed silicon wafer substrate for dense circuit and chip fabrication.
lead-plate=Lead plate used for radiation shielding and heavy industrial parts.
titanium-plate=Durable titanium plate for aerospace and high-temperature machinery.
aluminum-plate=Lightweight aluminum plate for frames, structures, and transport systems.
tin-plate=Low-melt tin plate used in alloys and precision electrical joining.
bronze-plate=Copper-tin alloy plate favored for bushings, bearings, and hard-wearing mechanical stock.
silicon=Refined silicon feedstock for electronics and ceramic composites.
fw-carbon=Washed carbon concentrate used in propellant and advanced chemistry.
remnant-beacon=An orbital beacon that attracts used rocket remnants. Platforms with a powered beacon are prioritized for remnant spawns.\nRecommended for stationary platforms with stable power.
rocket-chunk=Recovered debris from a used rocket. Can be reprocessed into valuable materials.
fw-rocket-avionics=Recovered high-tier avionics module used for rocket launch guidance and control systems.
fw-rocket-heatshield=Recovered heavy cladding module repurposed as thermal shielding for launch hardware.
fw-flux-catalyst=Reactive catalyst used to stabilize and amplify Flux transformations.
fw-stabilized-flux-crystal=Conditioned Flux crystal cross-linked with structuring flux for more stable precision handling.
fw-flux-lattice=Structured Flux matrix woven with chemical-phase alignment for late-stage integrated devices.
fw-harvester-head=Spectrum-tuned Harvester core that lets one machine sort, uplift, or break down difficult material streams without wasting Flux.
fw-annealed-cermet=Red-flux tempered cermet stock for machines that need to survive brutal thermal cycling and charged slurry abrasion.
fw-resonance-substrate=Signal substrate infused with stabilized Flux pathways so high-end control hardware can survive dense multi-spectrum work.
fw-flux-asteroid-chunk=A dense fragment of Flux-saturated asteroid matter recovered from deep-space debris fields.

fw-condensed-flux-matrix=Ultra-dense Flux matrix compressed from stabilized crystals and pressure-loaded spectrum streams.
fw-flux-resonance-cell=Charged containment cell that blends red-drive power with green stabilization for reliable multi-spectrum resonance.
fw-flux-phase-manifold=High-tolerance control manifold that synchronizes structured, energetic, and regenerative Flux streams under heavy load.
fw-flux-condenser=Destructively separates ordinary items into their recoverable Matter, Chemical, Fuel, and Bio Flux.
fw-shattered-convergence-array=Storm-powered machine for Shattered Planet convergence recipes.
fw-fired-ceramic=Kiln-fired ceramic stock used anywhere FluxWorks needs durable heat-safe shells before full cermet.
fw-ceramic-casing=Reinforced ceramic shell for machines that need insulation, rigidity, and modest shock resistance.
fw-coil-block=Compact coil-and-capacitor assembly for higher-density electromagnetic hardware.
fw-signal-conduit=Shielded signal conduit that carries control traffic through dirty industrial environments.
fw-lens-array=Stacked optical assembly for labs, scanners, and precision sensing.
fw-pressure-housing=Sealed industrial shell for hot, wet, or abrasive process equipment.
fw-flow-regulator=Metered process insert that keeps fluids moving evenly through advanced machinery.
fw-power-regulator=Conditioned power-routing unit for stable high-load electrical systems.
fw-field-winding=Heavy tuned winding used in machines that sustain strong electromagnetic fields.
fw-foundry-lining=Heat-hardened foundry liner that protects high-temperature industrial internals.
fw-cryo-coil=Cold-tolerant field coil for tightly controlled low-temperature machinery.
fw-thermal-buffer=Thermal damping assembly that smooths hard temperature swings in cryogenic systems.
fw-em-core=Electromagnetic control core for high-precision field generation and dense routing.
fw-logic-matrix=Late-stage control assembly that ties precision sensing into dense computational routing.
fw-promethium-shard=Promethium-rich fracture recovered from impact fields. Refine collected shards into stabilized Promethium Matrices for late Flux systems and origin-scale construction.
fw-promethium-matrix=Promethium-stabilized Flux assembly meant for the last steps before endgame science.
fw-quantum-computer=Dense control computer for advanced Flux and platform hardware.
fw-rift-stabilizer=High-energy stabilizer that forces all four disciplined Flux spectra and promethium hardware to hold together when source-grade reactions try to collapse back into chaos.
fw-model-lattice=Phase-modeling lattice that gives rift hardware a stable control template before it scales into exchange gates and origin structures.
fw-phase-anchor=Spatial stabilization hardware that pins a compressed inventory state in place under heavy Flux phase load.
fw-entanglement-core=Late-stage control core that keeps compressed storage coherent while coordinating long-range Flux state changes.
fw-reservoir-lining=Specialized containment shell built for aggressive thermal and pressure swings in late utility hardware.
fw-compression-baffle=Dedicated item-phase handling assembly that keeps deep storage compression from tearing fragile inventory states apart.
fw-thermal-phase-gasket=Crossover sealing part for phase-safe containment where heat stress and Flux routing meet.
fw-rift-coupler=Endgame rift bridge component reserved for the heaviest exchange and cross-surface utility systems.
fw-phase-vault=Powered deep storage unit that compresses overflow from one item type into a dense protected reserve.
fw-phase-vault-packed=Packed deep storage unit that preserves its stored item type and deep reserve when mined or moved.
fw-spectral-reservoir=Powered fluid storage unit that holds one fluid and retains its stabilized temperature in a deeper protected reserve.
fw-spectral-reservoir-packed=Packed fluid storage unit that preserves its stored fluid type, quantity, and temperature when mined or moved.
fw-rift-exchange-gate=Late-game logistics teleporter that charges a full exchange cycle, then swaps inventories with a matched gate on another surface.
fw-rift-exchange-fluid-gate=Late-game fluid teleporter that charges a full exchange cycle, then swaps stored fluids with a matched gate on another surface.
fw-origin-forge=Shattered Planet forge for Origin Project components.
fw-storm-spine-segment=Load-bearing storm conduit built to survive the Shattered Planet's most violent fuel-spectrum fracture belts.
fw-origin-crucible-lining=Promethium-safe containment shell meant for crucibles that hold converged source-grade Flux under extreme thermal and phase stress.
fw-harmonic-lattice-core=Dense harmonic control block that binds resonance hardware, entanglement logic, and converged lattice geometry into one origin-grade heart.
fw-living-reactor-weave=Fusion-fed biological power weave that forces Gleba-style regenerative behavior into a promethium-era reactor substrate.
fw-origin-catalyst-manifold=Final converged manifold that threads catalyst control, rift coupling, and source-grade phase routing through one brutal assembly.
fw-storm-spine=Massive storm-bearing trunk assembly intended to anchor whole shattered bridgehead webs into one endgame spine.
fw-origin-crucible=Large containment vessel for final Origin Project reactions.
fw-universal-collapse-core=Absurd source-grade collapse seed forged from a full billion units of every Flux spectrum at once, plus the nastiest late Shattered hardware you can build.
fw-genesis-ark=Final megaproject hull made from one thousand Collapse Cores.
fw-flux-harvester=Purple-flux ore transmutation machine for pushing materials up the ladder and reclaiming Flux when you break them back down.
fw-arc-foundry=High-heat Flux furnace that pushes dense industrial materials through fuel-spectrum annealing and recast operations.
fw-synthesis-plant=Precision Flux integration plant for stabilized crystals, resonance hardware, promethium conditioning, and late-game control assemblies.
fw-petrochemical-facility=Heavy refinery block for aggressive polymer chemistry, reactive binders, and late industrial fluid processing.
fw-hydraulic-plant=Pressure-tuned process machine for seals, manifolds, and fluid-control hardware that basic assemblers have no business making.
fw-chlorinated-binder-stock=Reactive chlorinated binder stock prepared for tougher petrochemical blends and late elastomer work.
fw-elastomer-matrix=Stabilized elastomer used in seals and pressure hardware.
fw-reinforced-seal=Pressure-rated sealing kit for machines that move aggressive fluids under heat and load.
fw-hydraulic-manifold=Multi-channel control block that distributes fluid pressure through late industrial machines.
fw-atomic-enricher=Late nuclear process machine for isotope conditioning, doped reactor materials, and other tightly controlled atomic assembly work.
fw-shielded-fuel-casing=Radiation-tolerant fuel casing built to hold hotter fuel stock and survive repeated enrichment handling.
fw-isotope-matrix=Stabilized isotopic composite used to seed denser and more reliable nuclear hardware.
fw-fuel-pellet-bundle=Conditioned uranium pellets for reactor fuel fabrication.
fw-moderator-lattice=Shielded moderator framework that keeps enriched fuel assemblies and late reactor hardware stable under load.
fw-control-rod-assembly=Field-tuned reactor control assembly that bridges thermal damping, shielding, and regulated neutron handling.
fw-reactor-coolant-cartridge=Sealed cryo-reactive cartridge that feeds controlled cooling into enriched fuel handling and advanced reactor support work.
fw-reactor-dopant=Reactor-grade atomic additive that pushes advanced power systems into more controlled late-game performance envelopes.
fw-radioactive-scrap=Spent radioactive residue pulled out of reconditioned fuel cycles before the useful actinides are fully recovered.
fw-recovered-actinides=Recovered heavy isotopic stock ready to be folded back into the controlled enrichment chain.
fw-reactor-grade-fuel-cell=Fabricate reactor fuel cells from conditioned pellet bundles, moderator hardware, and isotope stock so nuclear scaling actually runs through the Atomic Enricher.
fw-spent-fuel-reconditioning=Reprocess depleted fuel through coolant control and moderated reactor chemistry to reclaim fresh cells and reusable uranium stock.
fw-radioactive-scrap-sorting=Sort radioactive scrap into reusable actinide stock.
fw-isotope-recovery=Run recovered actinides back through controlled isotope work to reclaim fissile stock for the next enrichment cycle.
fw-nuclear-fuel-overdrive=Improves nuclear fuel with doped enrichment and cooling.

