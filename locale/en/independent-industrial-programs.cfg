[mod-setting-description]
fw-world-policy=Add FluxWorks' own resource deposits to existing worlds without removing native ores or modifying enemy and planet presets. Off leaves world generation untouched.
fw-native-cultures=Enable specialist bacteria cultures seeded from iron and copper bacteria in native biochambers, without changing stromatolite drops.
fw-industrial-programs=Add four standalone engineering research specializations with sixteen optional factory processes. These work with or without Razi Protocol.

