[mod-setting-description]
fw-rp-galactic-industry=Unlock optional, source-material factory alternatives across installed Razi Protocol worlds. Recipes are added only where actual native material producers and arrival research exist.
fw-rp-k2so-galaxy-industry=Additional planet-specific manufacturing combining real Krastorio2 Spaced Out intermediates with native world materials. Requires installed K2SO and respects the existing global FluxWorks K2SO integration switch. Does not change K2SO technology or machinery.
fw-rp-interplanetary-factories=Optional paired-world production that uses actual components from two previously researched planets. Does not provide teleportation or bypass routes.
