fw-flux-metallic-synthesis=Use resonance-driven Flux conversion to synthesize strategic late-game ores at industrial scale.
fw-flux-condenser=Construct a Flux Condenser for complex clone recipes using advanced Flux assemblies instead of base raw materials.
fw-arc-insulator-vitrification=Vitrify ceramic, glass, and metal feed in the Arc Foundry to make tougher high-load insulators for late electrical hardware.
fw-chlorine-pressurization=Pressurize salt brine into a stronger chlorine split for downstream chemical processing.
fw-latex-polymerization=Polymerize plastic feed with water into an industrial latex suitable for resin and elastomer chemistry.
fw-sulfur-bonding=Bind refined carbon and chlorine into dense recoverable sulfur for munitions and acid production.
fw-acid-synthesis=Drive sulfur, chlorine, and water into concentrated sulfuric acid for battery and industrial chemistry.
fw-resin-polymerization=Polymerize latex with refined carbon into a dense industrial resin binder.
fw-rubber-vulcanization=Vulcanize resin, latex, and sulfur into higher-yield rubber sheet stock for cables and composites.
fw-blasting-gel=Stabilize explosives, resin, and water into a demolition-grade blasting gel without consuming Flux.
fw-reactive-slurry=Drive blasting gel and explosives into demolition-grade reactive slurry for cliff breaching charges.
fw-battery-electrolyte=Use lead, copper, and sulfuric acid to assemble finished battery cells through a dedicated electrolyte route.
fw-napalm=Compound blasting gel, light oil, and sulfur into an adhesive incendiary fuel reserved for flamethrower turrets.
fw-electrolyte-conditioning=Filter holmium solution through resin media to condition a denser electrolyte for late electrical chemistry.
fw-lithium-adsorption=Use FluxWorks filtration and sensing hardware to pull more lithium out of each ammonia-brine pass.
fw-fluoroketone-synthesis=Run fluorine and ammonia through regulated thermal hardware to produce a larger fluoroketone batch.
fw-aquilo-cryogel=Condense Aquilo cryochemistry into stabilized cryogel packs that make extreme cold systems more manageable.
fw-gleba-spore-resin=Culture Gleba biomass into a living industrial resin with stronger late biological and promethium utility.
