[technology-description]
fw-precision-ceramics-1=Introduces tighter firing controls for ceramic bodies, wafers, insulation, and casings.
fw-precision-ceramics-2=Uses systems analysis to reduce cracking and recover more shaped ceramic stock.
fw-precision-ceramics-3=Applies Flux metrology to the most demanding precision ceramic production.
fw-pressure-systems-1=Reduces losses while manufacturing seals, regulators, housings, and hydraulic manifolds.
fw-pressure-systems-2=Coordinates pressure-component tolerances through instrumented production cells.
fw-pressure-systems-3=Uses spectral inspection to reclaim material from high-pressure assemblies.
fw-control-miniaturization-1=Improves production of compact circuits, sensors, substrates, and logic hardware.
fw-control-miniaturization-2=Shrinks control assemblies while preserving signal integrity and useful yield.
fw-control-miniaturization-3=Applies Flux-scale alignment to dense control and logic components.
fw-polymer-throughput-1=Recovers more useful material throughout the latex, resin, binder, and elastomer chain.
fw-polymer-throughput-2=Instruments polymer curing to reduce off-ratio batches and trapped feedstock.
fw-polymer-throughput-3=Uses spectral process control to stabilize demanding polymer production.
fw-spectral-hardware-1=Improves stabilized components used to route and synchronize high-energy Flux.
fw-spectral-hardware-2=Refines resonance hardware through multi-spectrum calibration and component recovery.
fw-spectral-hardware-3=Converges planetary field knowledge into exceptionally efficient phase hardware.
fw-cryogenic-reclamation-1=Recovers more coolant and cryogenic material from closed-loop Aquilo processes.
fw-cryogenic-reclamation-2=Adds spectral monitoring to prevent coolant and cryogel losses under load.
fw-cryogenic-reclamation-3=Converges planetary cryochemistry into near-closed material loops.
fw-orbital-recovery-1=Improves useful yield from Flux-rich asteroids and recovered rocket debris.
fw-orbital-recovery-2=Coordinates orbital sorting and advanced crushing around material composition.
fw-orbital-recovery-3=Uses planetary convergence models to recover the hardest orbital feedstocks.
fw-actinide-closure-methods-1=Pushes radioactive recovery toward a tighter and more productive fuel cycle.
fw-actinide-closure-methods-2=Improves isotope separation, dopant recovery, and actinide matrix handling.
fw-actinide-closure-methods-3=Converges planetary process knowledge into a highly closed actinide cycle.
fw-purple-spectrum-calibration=Calibrate Matter Flux machinery for repeatable ore grading and material beneficiation without strengthening one-way recovery values.
fw-yellow-spectrum-calibration=Apply Chemical Flux control to clarification, separation, and reactive-slurry processes.
fw-red-spectrum-calibration=Tune Fuel Flux heat profiles for ceramic annealing, cermet tempering, and dense foundry work.
fw-green-spectrum-calibration=Stabilize Bio Flux reclamation loops across composting, lubrication, and aquaculture.
fw-unified-spectrum-control=Unify all four chromatic disciplines and improve the precise intermediates where their process windows converge.
fw-spectral-recovery-theory=Formalize safe one-way Flux recovery and qualify the factory for repeatable process mastery without changing anchored valuations.
fw-actinide-closure=Close the authored nuclear recovery loop from radioactive scrap through recovered actinides and reconditioned fuel.
fw-rift-network-synchronization=Synchronize exchange gates across surfaces, reducing the baseline energy required for every transfer cycle.
fw-flux-synthesis-mastery=Infinite research that continues the finite Flux Process Mastery program, improving curated authored synthesis recipes by 2% productivity per level.
fw-spectral-reservoir-density=Repeatable research that expands safe Spectral Reservoir storage by 10% per level, up to level 20.
fw-rift-transfer-harmonics=Infinite research that reduces Rift Exchange cycle energy by 3% per level, with a 60% total reduction floor.
fw-convergence-research=Infinite planetary research that adds 2% laboratory productivity per level.
fw-harvester-throughput=Infinite calibration research that adds 1% productivity per level to the Flux Harvester's beneficiation family.
fw-shattered-planet-yield=Infinite convergence research that adds 2% productivity per level to selected Ion Storm processes.
fw-industrial-yield-1=Instrument mixed-deposit mines to recover more usable material from every extraction cycle.
fw-industrial-yield-2=Coordinate crushing feedback with drill control for a second step in global mining productivity.
fw-industrial-yield-3=Apply orbital-grade mineral models across the mining fleet for the program's largest yield increase.
fw-material-handling-1=Tune inserter timing and grip pressure to move larger batches through early industrial lines.
fw-material-handling-2=Synchronize bulk handling around production-scale buffers and higher sustained throughput.
fw-material-handling-3=Use space-grade scheduling to push inserter and bulk-inserter capacity to its final program tier.
fw-autonomous-logistics-1=Improve robot flight planning while increasing the useful payload of every logistics trip.
fw-autonomous-logistics-2=Coordinate charging, routing, and cargo allocation across large autonomous networks.
fw-autonomous-logistics-3=Deploy factory-wide traffic prediction for faster robots carrying another full payload increment.
fw-rail-network-control-1=Model train mass and braking curves to shorten safe stopping distances across the rail network.
fw-rail-network-control-2=Feed live signal telemetry into locomotive braking control for heavier, denser schedules.
fw-rail-network-control-3=Apply space-era network prediction to achieve the strongest braking response in the program.
fw-research-methodology-1=Standardize instrumentation and experimental design to make laboratories faster and less wasteful.
fw-research-methodology-2=Close the loop between production telemetry and laboratory work for more speed and productivity.
fw-research-methodology-3=Coordinate a space-scale research network that extracts substantially more progress from every pack.
fw-flux-process-mastery-1=Refine catalyst and stabilized-crystal production through tighter control of early Flux reactions.
fw-flux-process-mastery-2=Recover more value from metallic synthesis and orbital Flux-asteroid refinement.
fw-flux-process-mastery-3=Master resonance and phase assembly to improve the yield of the most demanding Flux components.
fw-industrial-methods-science=Unlocks Industrial Methods Science for fabrication and material-processing research.
fw-systems-analysis-science=Unlocks Systems Analysis Science for automation, control, and network research.
fw-flux-theory-science=Unlocks Flux Theory Science for advanced Flux systems and synthesis.
fw-planetary-convergence-science=Unlocks Planetary Convergence Science for Shattered Planet and origin research.
fw-industrial-district-project=Apply Industrial Methods Science to permanently improve mining productivity and inserter capacity.
