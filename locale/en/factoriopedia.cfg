[tips-and-tricks-item-description]
fluxworks-overview=FluxWorks starts as a resource expansion and slowly turns into its own production language.\n\nYou begin by extracting [entity=fw-crystalised-flux] with the [entity=fw-flux-quarry], but that is only the first contact point. Those Rift crystals are fractured source material from the Shattered Planet, and the whole mod is really about learning to process that material before you can ever reach the source itself.\n\nIf a recipe feels strange, the usual answer is to step one machine earlier and ask which Flux layer it belongs to.
flux-rift-extraction=[entity=fw-flux-quarry] only works on [entity=fw-crystalised-flux] rifts, so think of it as a dedicated field machine rather than a general miner.\n\nRifts are rich but specialized because they are not the source of Flux, only the earliest fragments of it. Once you have stable quarry output, convert that shattered material into catalysts and machine parts instead of trying to stockpile it forever as a raw ore.
shattered-flux-source=The most important thing to understand about Flux is that the early Rift field is a symptom, not the origin.\n\n[entity=fw-crystalised-flux] is fractured Shattered Planet material that reached normal factory space before you did. Later, once you can land on [planet=shattered-planet], you stop living off fragments and start exploiting the real source through vents, storms, and shattered-island outposts.
mixed-deposit-planning=Most FluxWorks worldgen is built around mixed deposits instead of perfectly pure patches. [entity=fw-metallic-deposit], [entity=fw-mineral-deposit], and [entity=fw-carbonic-deposit] are meant to give you broad mining districts that feed several chains at once.\n\nThat means sorting and beneficiation matter more than in vanilla. Plan belts, trains, and buffers around families of output rather than assuming every patch deserves its own isolated smelting line.
early-processing-bootstrap=The first real FluxWorks payoff is not a late machine, it is the [recipe=crusher] and the small chain behind it. Start by crushing iron, copper, stone, and the mixed deposit ores, then use that output to unlock cleaner sand, carbon, salt, and early structural parts.\n\nIf the branch feels overwhelming, think in a short ladder: [recipe=crusher] into [item=fw-sand] and [item=fw-carbon], then into [item=fw-glass], [item=fw-rubber-sheet], [item=fw-copper-tube], and [item=fw-inline-filter]. Those four parts are the real bridge into the rest of the mod.
flux-processing-ladder=The usual machine order is [entity=fw-flux-harvester] for purple-flux ore tier shifts and the first heavy ore cleanup, then [entity=fw-arc-foundry] for hotter structural materials, then [entity=fw-synthesis-plant] for resonance and promethium work.\n\nIf you are unsure where a recipe belongs, follow the item family: rough ore and mixed deposits go to the Harvester, heat-stressed materials go to the Arc Foundry, and phase-controlled parts go to the Synthesis Plant.
flux-synthesis-and-cloning=[entity=fw-synthesis-plant] is where raw Flux finally becomes disciplined. This is the machine for stabilized crystals, lattices, matrices, and the first serious promethium intermediates.\n\n[entity=fw-flux-condenser] sits even later. It clones seed items using standard recipes and [fluid=fw-purple-flux], so it works best as a multiplier for expensive products, not as a replacement for your normal production lines.
promethium-ramp=Promethium should feel like a ramp, not a wall. Start with [item=fw-promethium-shard], turn that into [item=fw-promethium-primer], then graduate into matrices and stabilizers once the rest of your Flux factory is mature enough to support them.\n\nIf promethium recipes feel expensive, that is usually a signal that your resonance, lattice, and catalyst production is still too small. Grow the supporting factory first and the promethium lane becomes much smoother.
flux-orbital-salvage=FluxWorks also has a space-side salvage loop. [entity=remnant-beacon] attracts recoverable rocket remnants, and processed [item=rocket-chunk] gives platforms a way to reclaim advanced materials instead of treating launches as pure waste.\n\nThis complements platform production nicely: asteroid processing handles the steady basics, while remnant salvage helps cover the expensive aerospace edge pieces.
petrochem-and-hydraulics=[entity=fw-petrochemical-facility] is where FluxWorks chemistry stops being basic support work and becomes its own branch. Use it to turn [item=fw-resin], [fluid=fw-latex], [fluid=fw-chlorine], and acid into binders and elastomer stock, then hand those parts forward into [entity=fw-hydraulic-plant] for seals, actuators, valves, and manifolds.\n\nA good rule of thumb is that petrochem makes the reactive materials, while hydraulics turns them into pressure-rated machine hardware. If a later machine suddenly asks for [item=fw-reinforced-seal] or [item=fw-hydraulic-manifold], the answer is usually to grow those two branches together instead of hunting for a shortcut assembler recipe.
atomic-enrichment-loop=[entity=fw-atomic-enricher] is not just a better centrifuge. It is the late nuclear branch that turns isotope stock into reactor-grade parts, then closes the loop by recovering value from spent fuel and radioactive scrap.\n\nThink of the chain in three steps: conditioning makes [item=fw-isotope-matrix] and [item=fw-fuel-pellet-bundle], reactor doping turns that into control hardware and [item=fw-reactor-dopant], and recovery turns spent fuel back into useful actinides. If the branch feels expensive, that usually means it is time to scale the recovery leg, not abandon the enriched recipes.
deep-storage-and-rift-logistics=[item=fw-phase-vault] and [item=fw-spectral-reservoir] are not generic bigger chests. They are single-resource deep-storage structures built for late factories that need stable reserves, clean circuit readout, and preserved packed contents when moved.\n\n[item=fw-rift-exchange-gate] and [item=fw-rift-exchange-fluid-gate] sit one layer above them as logistics bridges between surfaces. Use the storage units to tame local overflow first, then use gates when the real problem is moving curated inventory or fluids between distant factory islands rather than just storing more of it in one place.
green-flux-recovery=[fluid=fw-green-flux] is the living recovery lane. You make it from spoilage, nutrients, fish, seeds, and other biological stock, then spend it to reclaim value from biomass or push that biomass into more productive growth loops.\n\nThe important mental shift is that Green Flux is not just another crafting fluid. It is the branch that turns waste, feedstock, and propagation material back into useful factory momentum. If Gleba-style recipes feel unstable, scale your Green Flux recovery first and the whole biological side of the mod becomes easier to sustain.
planetary-chemistry-rewards=The late chemistry branch pays off by turning each planet into a distinct Flux reward instead of just another science gate. [item=fw-aquilo-cryogel] belongs to the cryogenic lane, [item=fw-gleba-spore-resin] belongs to the biological lane, [item=fw-fulgora-static-mesh] belongs to the electromagnetic lane, and [item=fw-vulcanus-slag-cermet] belongs to the foundry lane.\n\nThese are best treated as capstone materials, not casual intermediates. When a high-end recipe asks for one of them, it is usually pointing at a specific planetary support branch you now need to scale, not a random extra ingredient that can be ignored.
thermal-and-superconductive-infrastructure=The late Red lane is not just more heat. Once [technology=fw-superconductive-systems] lands, the hot industrial branch starts merging with Aquilo cold-control and Fulgora electrical materials to produce [item=superconductor] and [item=supercapacitor].\n\nThat is the point where FluxWorks starts treating heat, cooling, and field control as one shared infrastructure layer. If late recipes suddenly demand cryogenic, electrical, and thermal parts at the same time, that is not recipe bloat. It is the mod telling you to scale the converged power-and-control backbone instead of one isolated planet branch.
shattered-island-traversal=The Shattered Planet is not meant to be one comfortable continent. Its cliffs, fracture belts, and floating-island gaps are there to force route planning and local specialization.\n\nYour first landfall should now read as a cracked landing shelf with a few fragile bridge spokes leading outward. Use those spokes to claim the nearest workable islands, then build compact outposts near the vents they are meant to exploit instead of assuming every build should sprawl across one giant safe plateau.
shattered-bridgeheads=Once [technology=fw-flux-convergence] lands, the Shattered Planet should stop behaving like a raw-fluid mining colony and start behaving like a network of bridgehead factories. The ion storm lets you upgrade cryogel, static mesh, slag cermet, and eventually superconductive hardware directly on the source surface.\n\nThat means the best shattered islands are not always the ones with the most room. They are the ones where a vent cluster, a survivable footprint, and a logistics link line up well enough to support a small specialized export base.
shattered-convergence-network=By [technology=fw-rift-harmonics], a good shattered factory should feel less like one base and more like a hostile network of linked bridgeheads. Purple islands can overdrive resonance hardware, red belts can push fusion and thermal exports, green outposts keep the living materials flowing, and yellow chemistry keeps the whole thing from stalling.\n\nThat network is the real endgame fantasy of FluxWorks. You are no longer refining fragments that drifted into safer space. You are coordinating the source planet itself, then forcing that whole storm-fed supply web through final recipes like [recipe=fw-ion-storm-rift-stabilizer-convergence].
shattered-origin-projects=Once [technology=fw-rift-harmonics] is unlocked, the Shattered Planet becomes the true endgame site. [entity=fw-shattered-convergence-array] starts the branch, [entity=fw-origin-forge] expands it, and [entity=fw-origin-singularity] ends it.\n\nBuild a stable island network, feed the branch all four Flux colors and your late planetary materials, then place and fully charge the monument on the Shattered Planet to win.
shattered-vent-biomes=On the Shattered Planet, terrain color is meant to tell you which Flux vent belongs there. Yellow shelves point toward yellow chemistry vents, red fracture land points toward red thermal vents, green growth shelves point toward green recovery vents, and purple resonance ground points toward purple structuring vents.\n\nIf you are scouting new islands, follow the color first. Matching each vent harvester to its biome is the core rule of the planet.
shattered-origin-revelation=[technology=fw-flux-convergence] is the moment the branch should finally click: the early Rift field was never the true source of Flux.\n\nBy the time you can work the Shattered Planet directly, you are no longer living off broken fragments that drifted into ordinary space. You are exploiting the origin itself through vents, ion-storm synthesis, and shattered-island infrastructure. The early game taught you how to process Flux. The Shattered Planet explains where it was really coming from.
flux-convergence-and-rift-control=[technology=fw-flux-convergence] is where the separate Flux colors stop feeling like side branches and start behaving like one mature endgame language. [item=fw-rift-stabilizer] is the clearest example: it consumes all four conditioned Flux spectra, promethium products, phase hardware, and the capstone materials from Aquilo, Gleba, Fulgora, and Vulcanus.\n\nWhen that layer opens, the correct response is usually to build shared late-game infrastructure instead of chasing single missing parts. Grow manifolds, resonance cells, stabilizers, and planetary reward materials together, then let those feed phase storage, synthetic rift growth, and [item=fw-rift-exchange-gate] or [item=fw-rift-exchange-fluid-gate] logistics.
