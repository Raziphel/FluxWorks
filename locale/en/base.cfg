[space-location-description]
shattered-planet=A tiny world torn into drifting islands beneath relentless ion lightning and incoming asteroids. Land with [entity=lightning-collector] protection, defend every approach with [entity=gun-turret], then claim its vents to harvest [fluid=fw-purple-flux], [fluid=fw-yellow-flux], [fluid=fw-red-flux], and [fluid=fw-green-flux] at their source.\n\n[font=default-bold]Victory[/font]\nResearch [technology=fw-rift-harmonics], establish a storm-fed [entity=fw-shattered-convergence-array], and use an [entity=fw-origin-forge] to construct the [entity=fw-origin-singularity]. Place and fully charge the singularity here to win the game.

