[fluid-description]
fw-purple-flux=Base structuring flux used for transmutation, recovery loops, and crystal stabilization. It is the orderly spectrum, not the parent ingredient of every other Flux color.
fw-yellow-flux=Chemical-ordering flux produced from reactive chemistry stock and used to bind catalysts, reorganize intermediates, and push industrial chemistry into line.
fw-red-flux=Thermal-drive flux produced from fuel-dense stock and used to condense energy value, harden hot materials, and feed high-intensity industrial reactions.
fw-green-flux=Regenerative bio flux produced from living or decaying biomass and used to recover spoilage, stabilize feedstock, and push growth back into useful output.
fw-latex=Industrial polymer emulsion used as a precursor for resin chemistry and high-yield rubber processing.
fw-blasting-gel=Stabilized reactive gel used for advanced demolition and high-energy chemical explosive synthesis.
fw-napalm=Adhesive incendiary slurry prepared for sustained turret fire and area denial.

