[item-description]
fw-foundry-folio=Bound calibrations from multiple real industrial regions. The Atlas converts this folio and its counterpart into an endgame Forge standard.
fw-foundry-record=A physical field calibration preserved from industrial work on a distant system. Combine field records in the Atlas when enough systems have been established.

